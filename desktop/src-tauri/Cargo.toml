[package]
name = "kontor"
version = "0.38.5"
description = "Kontor – Warenwirtschaft & Kasse (On-Premise)"
authors = ["Kontor"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
sha2 = { version = "0.10", features = ["oid"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# RKSV: ES256-Signatur, AES-256-ICM-Umsatzzähler, Base64, QR-Code
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
aes = "0.8"
ctr = "0.9"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
qrcode = { version = "0.14", default-features = false, features = ["svg", "image"] }
# Paket 5: Bilder (Artikel, Logo), verschlüsselte Sicherungen, E-Mail-Belege
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rxing = { version = "0.9", default-features = false, features = ["image", "decoders", "oned", "qrcode", "encoding_rs"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "hostname"] }
url = "2"
# Paket 6: Webhooks/KI-Modell (HTTP-Client), lokale REST-API (HTTP-Server), TOTP (HMAC-SHA1)
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
tiny_http = "0.12"
sha1 = "0.10"
# Paket 8: Single Sign-On (RS256-Signaturen der Identitätsanbieter)
rsa = "0.9"
# Paket 12: Import von Advarics-Exporten (XLSX mit eingebetteten Bildern)
calamine = { version = "0.36", default-features = false }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
# Bondrucker über den Windows-Druckerspooler (RAW)
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Security", "Foundation", "Security_Credentials_UI", "Win32_System_WinRT"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
