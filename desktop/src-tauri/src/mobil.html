<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kontor mobil</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--line:#e4e7ec;--text:#101828;--text2:#475467;--text3:#98a2b3;--acc:#1f6fd1;--acc2:#e8f1fd;--pos:#12805c;--neg:#c4320a;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#5aa0ff,#1f6fd1);color:#fff;display:grid;place-items:center;font-weight:700}
header b{font-size:16px}header small{display:block;color:var(--text3);font-size:12px}
header .sp{flex:1}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.s{height:38px;padding:0 12px;font-size:14px}.btn.w{width:100%}
.btn.pos{background:var(--pos);border-color:var(--pos);color:#fff}.btn.neg{background:#fff;border-color:#f3c2b3;color:var(--neg)}
input.in{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);padding:0 14px;background:#fff;font-size:17px;outline:none}
input.in:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc2)}
.row{display:flex;gap:8px;align-items:center}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.users button{height:56px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600}
.users button[aria-pressed=true]{border-color:var(--acc);background:var(--acc2);color:var(--acc)}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--text3)}.dots i.on{background:var(--text);border-color:var(--text)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{height:58px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:22px;font-weight:600}
.err{color:var(--neg);text-align:center;font-size:14px;min-height:20px}
.it{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}.it:last-child{border-bottom:0}
.it .m{flex:1;min-width:0}.it .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .s{color:var(--text2);font-size:13px}
.qty{font-size:20px;font-weight:700;min-width:44px;text-align:right}.low{color:var(--neg)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;height:52px;border:0;background:none;border-radius:12px;color:var(--text2);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button[aria-current=true]{color:var(--acc);background:var(--acc2)}
.big{font-size:44px;font-weight:750;letter-spacing:-.02em}
.stepper{display:flex;align-items:center;gap:8px}.stepper button{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:24px}
.stepper input{width:90px;text-align:center;font-size:22px;font-weight:700}
.seg{display:flex;background:#eef1f5;border-radius:12px;padding:3px}.seg button{flex:1;height:40px;border:0;border-radius:10px;background:none;font-weight:600;color:var(--text2)}.seg button[aria-pressed=true]{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));background:#101828;color:#fff;border-radius:12px;padding:12px 14px;font-weight:600;transform:translateY(150%);transition:transform .25s;z-index:9}.toast.on{transform:none}
.muted{color:var(--text3);font-size:13px}
h2{font-size:18px;margin:2px 0 10px}
label.cam{position:relative;overflow:hidden}label.cam input{position:absolute;inset:0;opacity:0}
</style>
</head>
<body>
<header><div class="logo">K</div><div><b>Kontor mobil</b><small id="sub">Lager & Inventur</small></div><span class="sp"></span><button class="btn s" id="out" hidden>Abmelden</button></header>
<main id="app"></main>
<nav id="nav" hidden><button data-t="suche" aria-current="true">🔍<span>Artikel</span></button><button data-t="inventur">📋<span>Inventur</span></button></nav>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const CN = {moos: 'Moos', schiefer: 'Schiefer', glut: 'Glut', gletscher: 'Gletscher', sand: 'Sand', nacht: 'Nacht', senf: 'Senf', beere: 'Beere', fels: 'Fels', creme: 'Creme', petrol: 'Petrol', rot: 'Signalrot', weiss: 'Schnee'};
const cn = c => CN[c] || c;
const eur = v => new Intl.NumberFormat('de-AT', {style: 'currency', currency: 'EUR'}).format(v);
let S = JSON.parse(sessionStorage.getItem('kontor.mobil') || 'null'), tab = 'suche', sel = null;
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 2400); };
async function api(path, opt = {}) {
  const r = await fetch('/mobil/api/' + path, {method: opt.method || (opt.body ? 'POST' : 'GET'), headers: {'X-Kontor-Sitzung': S?.token || '', ...(opt.raw ? {} : {'Content-Type': 'application/json'})}, body: opt.raw || (opt.body ? JSON.stringify(opt.body) : undefined)});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && S && path !== 'login') { S = null; sessionStorage.removeItem('kontor.mobil'); login(); throw new Error(j.fehler || 'Bitte neu anmelden'); }
  if (!r.ok) { const e = new Error(j.fehler || 'Fehler ' + r.status); e.data = j; throw e; }
  return j;
}
async function login(msg) {
  $('#nav').hidden = true; $('#out').hidden = true;
  let d; try { d = await api('benutzer'); } catch (e) { app.innerHTML = `<div class="card">Kontor nicht erreichbar.<br><span class="muted">${esc(e.message)}</span></div>`; return; }
  $('#sub').textContent = d.firma || 'Lager & Inventur';
  let user = d.benutzer[0]?.id, pin = '', code = null;
  const render = (m) => {
    app.innerHTML = `<div class="card"><h2>Anmelden</h2><div class="users">${d.benutzer.map(u => `<button data-u="${esc(u.id)}" aria-pressed="${u.id === user}">${esc(u.name)}</button>`).join('')}</div>
      <div class="dots">${[0, 1, 2, 3].map(i => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join('')}</div><div class="err">${esc(m || '')}</div>
      <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<span></span><button data-k="0">0</button><button data-k="b">⌫</button></div></div>
      <p class="muted" style="text-align:center">Gleiche PIN wie an der Kasse.</p>`;
  };
  const go = async () => {
    try { S = await api('login', {body: {user, pin, code}}); sessionStorage.setItem('kontor.mobil', JSON.stringify(S)); main(); }
    catch (e) {
      if (e.data?.totp) { code = prompt('Code aus der Authenticator-App (6 Ziffern)') || ''; if (code) return go(); }
      pin = ''; code = null; render(e.message);
    }
  };
  render(msg);
  app.onclick = e => {
    const u = e.target.closest('[data-u]'); if (u) { user = u.dataset.u; pin = ''; return render(); }
    const k = e.target.closest('[data-k]'); if (!k) return;
    pin = k.dataset.k === 'b' ? pin.slice(0, -1) : (pin + k.dataset.k).slice(0, 4); render();
    if (pin.length === 4) go();
  };
}
function main() {
  $('#nav').hidden = false; $('#out').hidden = false; $('#sub').textContent = `${S.name} · angemeldet`;
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.t === tab));
  app.onclick = null;
  tab === 'suche' ? renderSearch() : renderInv();
}
const scanBox = (ph) => `<div class="row"><input class="in" id="q" placeholder="${ph}" autocomplete="off" inputmode="search" enterkeyhint="search"><label class="btn cam" title="Foto vom Barcode">📷<input type="file" accept="image/*" capture="environment" id="cam"></label></div>`;
async function photo(file) {
  toast('Barcode wird gelesen …');
  try { const r = await api('foto', {raw: file}); return r.code; } catch (e) { toast(e.message); return null; }
}
function renderSearch() {
  app.innerHTML = `<div class="card">${scanBox('Artikel, Marke oder EAN')}</div><div id="res"></div>`;
  const q = $('#q'); q.focus();
  const run = async v => { if (!v.trim()) { $('#res').innerHTML = ''; return; } try { const l = await api('suche?q=' + encodeURIComponent(v)); list(l); if (l.length === 1 && l[0].ean === v.trim()) detail(l[0]); } catch (e) { toast(e.message); } };
  let t; q.oninput = () => { clearTimeout(t); t = setTimeout(() => run(q.value), 250); };
  q.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); run(q.value); } };
  $('#cam').onchange = async e => { const f = e.target.files[0]; if (!f) return; const c = await photo(f); if (c) { q.value = c; run(c); } e.target.value = ''; };
}
function list(l) {
  $('#res').innerHTML = l.length ? `<div class="card">${l.map((v, i) => `<div class="it" data-i="${i}"><div class="m"><div class="t">${esc(v.name)}</div><div class="s">${esc(cn(v.farbe))} · ${esc(v.groesse)} · ${esc(v.ean)}</div></div><div class="qty ${v.bestand <= v.mindest ? 'low' : ''}">${v.bestand}</div></div>`).join('')}</div>` : '<div class="card muted">Nichts gefunden.</div>';
  $('#res').onclick = e => { const it = e.target.closest('[data-i]'); if (it) detail(l[+it.dataset.i]); };
}
function detail(v) {
  sel = v; let art = 'zugang', n = 1;
  const render = () => {
    app.innerHTML = `<button class="btn s" id="back">← Zurück</button><div class="card" style="margin-top:12px"><div class="muted">${esc(v.marke)} · ${esc(v.artikel)}</div><h2 style="margin:4px 0">${esc(v.name)}</h2><div class="s">${esc(cn(v.farbe))} · Größe ${esc(v.groesse)} · EAN ${esc(v.ean)}</div>
      <div class="row" style="justify-content:space-between;margin-top:14px"><div><div class="muted">Bestand</div><div class="big ${v.bestand <= v.mindest ? 'low' : ''}">${v.bestand}</div></div><div style="text-align:right"><div class="muted">Preis</div><div style="font-size:22px;font-weight:700">${eur(v.preis)}</div></div></div></div>
      ${S.rechte?.buchen ? `<div class="card"><div class="seg">${[['zugang', 'Zugang'], ['abgang', 'Abgang'], ['inventur', 'Zählen']].map(([k, l]) => `<button data-a="${k}" aria-pressed="${art === k}">${l}</button>`).join('')}</div>
        <div class="row" style="justify-content:center;margin:16px 0"><div class="stepper"><button data-n="-1">−</button><input class="in" id="n" type="number" inputmode="numeric" value="${n}"><button data-n="1">+</button></div></div>
        <button class="btn p w" id="go">${art === 'inventur' ? `Bestand auf ${n} setzen` : `${n} Stück ${art === 'zugang' ? 'zubuchen' : 'abbuchen'}`}</button></div>` : '<div class="card muted">Keine Berechtigung zum Buchen.</div>'}`;
  };
  render();
  app.onclick = async e => {
    if (e.target.closest('#back')) { app.onclick = null; return renderSearch(); }
    const a = e.target.closest('[data-a]'); if (a) { art = a.dataset.a; if (art === 'inventur') n = v.bestand; return render(); }
    const s = e.target.closest('[data-n]'); if (s) { n = Math.max(art === 'inventur' ? 0 : 1, (parseInt($('#n').value) || 0) + +s.dataset.n); return render(); }
    if (e.target.closest('#go')) {
      n = parseInt($('#n').value) || 0;
      try { const r = await api('buchung', {body: {ean: v.ean, menge: n, art}}); v.bestand = r.bestand; toast(`Gebucht · Bestand jetzt ${r.bestand}`); render(); } catch (err) { toast(err.message); }
    }
  };
  app.oninput = e => { if (e.target.id === 'n') n = parseInt(e.target.value) || 0; };
}
async function renderInv() {
  let inv; try { inv = await api('inventur'); } catch (e) { app.innerHTML = `<div class="card">${esc(e.message)}</div>`; return; }
  if (!inv) { app.innerHTML = '<div class="card"><h2>Keine offene Inventur</h2><p class="muted">Am PC unter Sortiment → Inventur eine Zählung starten. Danach hier scannen – jeder Scan zählt ein Stück.</p><button class="btn w" id="re">Erneut prüfen</button></div>'; $('#re').onclick = renderInv; return; }
  app.innerHTML = `<div class="card"><h2>Inventur ${esc(inv.no)}</h2><div class="muted">${inv.counted} von ${inv.lines} Varianten gezählt · jeder Scan = +1</div></div><div class="card">${scanBox('EAN scannen oder eingeben')}</div><div id="log"></div>`;
  const q = $('#q'); q.focus(); const log = [];
  const count = async ean => {
    if (!ean.trim()) return;
    try { const r = await api('zaehlen', {body: {ean: ean.trim(), menge: 1, dazu: true}}); log.unshift({ean, ...r.ergebnis}); if (navigator.vibrate) navigator.vibrate(30);
      $('#log').innerHTML = `<div class="card">${log.slice(0, 20).map(x => `<div class="it"><div class="m"><div class="t">${esc(x.ean)}</div><div class="s">Soll ${x.expected}</div></div><div class="qty">${x.counted}</div></div>`).join('')}</div>`; }
    catch (e) { toast(e.message); if (navigator.vibrate) navigator.vibrate([80, 60, 80]); }
    q.value = ''; q.focus();
  };
  q.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); count(q.value); } };
  $('#cam').onchange = async e => { const f = e.target.files[0]; if (!f) return; const c = await photo(f); if (c) count(c); e.target.value = ''; };
}
$('#nav').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { tab = b.dataset.t; main(); } };
$('#out').onclick = async () => { try { await api('abmelden', {body: {}}); } catch {} S = null; sessionStorage.removeItem('kontor.mobil'); login(); };
S ? main() : login();
</script>
</body>
</html>
