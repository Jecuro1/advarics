      description: "Returns lost sales statistics for a specific dealer of a brand.\nThe dealer is identified by the brand's internal customer ID.\n\nThis is an **Enterprise** feature. Access requires an active Enterprise subscription for the authenticated tenant."
      parameters:
        -
          in: query
          name: date_min
          description: 'Start date in d.m.Y format.'
          example: 01.01.2026
          required: true
          schema:
            type: string
            description: 'Start date in d.m.Y format.'
            example: 01.01.2026
        -
          in: query
          name: date_max
          description: 'End date in d.m.Y format. Must not exceed 12 months from date_min.'
          example: 31.01.2026
          required: true
          schema:
            type: string
            description: 'End date in d.m.Y format. Must not exceed 12 months from date_min.'
            example: 31.01.2026
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    dealer_name: 'Bike Shop Mueller'
                    customer_external_id: MAG-42
                    brand_id: 134
                    brand_name: MAGURA
                    date_min: 01.01.2026
                    date_max: 31.01.2026
                    outtra_connected: true
                    kpis:
                      impressions: 279
                      product_searches: 350
                      market_potential_in_eur: 78888.0
                      lost_sales_in_eur: 70254.0
                      highlights: 279
                    products:
                      -
                        product_identifier: Mt7
                        article_number: mdp-9
                        gtin: '04055184026014'
                        article_name_de: 'Bremsscheibe MDR-P'
                        article_name_en: 'Brake Disc MDR-P'
                        searches: 120
                        lost_revenue_in_eur: 3548.0
                        uvp_max: 89.9
                    chart_data:
                      -
                        label: '2026-01-15T00:00:00.000Z'
                        market_potential_in_eur: 5000.0
                        lost_sales_in_eur: 3500.0
                        impressions: 25
                properties:
                  data:
                    type: object
                    properties:
                      dealer_name:
                        type: string
                        example: 'Bike Shop Mueller'
                        description: 'Name of the dealer. Example: Bike Shop Mueller'
                      customer_external_id:
                        type: string
                        example: MAG-42
                        description: "The brand's customer ID for this dealer. Example: MAG-42"
                      brand_id:
                        type: integer
                        example: 134
                        description: 'The OUTTRA brand ID. Example: 134'
                      brand_name:
                        type: string
                        example: MAGURA
                        description: 'Name of the brand. Example: MAGURA'
                      date_min:
                        type: string
                        example: 01.01.2026
                        description: 'Start of the queried date range. Example: 01.01.2026'
                      date_max:
                        type: string
                        example: 31.01.2026
                        description: 'End of the queried date range. Example: 31.01.2026'
                      outtra_connected:
                        type: boolean
                        example: true
                        description: 'True if the dealer submits stock_items for this brand to OUTTRA, false otherwise. Example: true'
                      kpis:
                        type: object
                        properties:
                          impressions:
                            type: integer
                            example: 279
                            description: 'How often the dealer appeared in Dealer Locator results across all devices (mobile, tablet, desktop). Example: 279'
                          product_searches:
                            type: integer
                            example: 350
                            description: "Number of product search events where this dealer was listed for the brand's products, regardless of stock status. Example: 350"
                          market_potential_in_eur:
                            type: number
                            example: 78888.0
                            description: 'Total recommended retail price (UVP) across all product searches where the dealer appeared. Represents the full revenue potential if every searched product had been available. Example: 78888.00'
                          lost_sales_in_eur:
                            type: number
                            example: 70254.0
                            description: 'Total UVP of product searches where the dealer appeared but the product was out of stock or not stocked. Example: 70254.00'
                          highlights:
                            type: integer
                            example: 279
                            description: 'Number of product searches where the dealer had the product in stock. Example: 279'
                      products:
                        type: array
                        example:
                          -
                            product_identifier: Mt7
                            article_number: mdp-9
                            gtin: '04055184026014'
                            article_name_de: 'Bremsscheibe MDR-P'
                            article_name_en: 'Brake Disc MDR-P'
                            searches: 120
                            lost_revenue_in_eur: 3548
                            uvp_max: 89.9
                        description: 'Top 20 products sorted by lost revenue (UVP sum), descending.'
                        items:
                          type: object
                          properties:
                            product_identifier:
                              type: string
                              example: Mt7
                            article_number:
                              type: string
                              example: mdp-9
                            gtin:
                              type: string
                              example: '04055184026014'
                            article_name_de:
                              type: string
                              example: 'Bremsscheibe MDR-P'
                            article_name_en:
                              type: string
                              example: 'Brake Disc MDR-P'
                            searches:
                              type: integer
                              example: 120
                            lost_revenue_in_eur:
                              type: number
                              example: 3548.0
                            uvp_max:
                              type: number
                              example: 89.9
                      chart_data:
                        type: array
                        example:
                          -
                            label: '2026-01-15T00:00:00.000Z'
                            market_potential_in_eur: 5000
                            lost_sales_in_eur: 3500
                            impressions: 25
                        description: 'Time series data points. Uses daily intervals for ranges up to 31 days, monthly intervals for longer ranges.'
                        items:
                          type: object
                          properties:
                            label:
                              type: string
                              example: '2026-01-15T00:00:00.000Z'
                            market_potential_in_eur:
                              type: number
                              example: 5000.0
                            lost_sales_in_eur:
                              type: number
                              example: 3500.0
                            impressions:
                              type: integer
                              example: 25
        401:
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        404:
          description: 'Dealer not found'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Dealer not found.'
                properties:
                  message:
                    type: string
                    example: 'Dealer not found.'
        422:
          description: 'Validation error'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The date min field is required.'
                  errors:
                    date_min:
                      - 'The date min field is required.'
                properties:
                  message:
                    type: string
                    example: 'The date min field is required.'
                  errors:
                    type: object
                    properties:
                      date_min:
                        type: array
                        example:
                          - 'The date min field is required.'
                        items:
                          type: string
      tags:
        - 'Retailer Insights (Enterprise)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date_min:
                  type: string
                  description: 'Must be a valid date in the format <code>d.m.Y</code>.'
                  example: 19.04.2026
                date_max:
                  type: string
                  description: 'Must be a valid date in the format <code>d.m.Y</code>. Must be a date after or equal to <code>date_min</code>.'
                  example: '2033-12-09'
              required:
                - date_min
                - date_max
    parameters:
      -
        in: path
        name: outtraBrandId
        description: 'The OUTTRA brand ID. Must match a brand accessible by the authenticated tenant.'
        example: 134
        required: true
        schema:
          type: integer
      -
        in: path
        name: customerExternalId
        description: "The brand's internal customer ID for the dealer."
        example: MAG-42
        required: true
        schema:
          type: string
