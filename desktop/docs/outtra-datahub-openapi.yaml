openapi: 3.0.3
info:
  title: 'OUTTRA DataHub API'
  description: 'Documentation for the OUTTRA DataHub API'
  version: 1.0.0
servers:
  -
    url: 'https://datahub_api.test'
paths:
  /api/v2/datahub/products:
    get:
      summary: 'GET api/v2/datahub/products'
      operationId: gETApiv2datahubproducts
      description: "Query the DataHub for product information.\n\n**Important:**\n<aside class=\"info\"> You have to set at least one filter property.</aside>"
      parameters:
        -
          in: query
          name: language
          description: 'Returns the data in the specific language, if available. Expects a ISO-639-1 two-character language code. Fallback is english (en).'
          example: de
          required: false
          schema:
            type: string
            description: 'Returns the data in the specific language, if available. Expects a ISO-639-1 two-character language code. Fallback is english (en).'
            example: de
        -
          in: query
          name: 'page[size]'
          description: 'Set the number of elements returned. Max is 30.'
          example: 2
          required: false
          schema:
            type: integer
            description: 'Set the number of elements returned. Max is 30.'
            example: 2
        -
          in: query
          name: 'page[number]'
          description: 'Pagination found under the links attribute in the response.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Pagination found under the links attribute in the response.'
            example: 1
        -
          in: query
          name: 'filter[brand]'
          description: 'Filters the data to a brand. Expects an ID that can be retrieved via the /datahub/my/brands endpoint.'
          example: 136
          required: false
          schema:
            type: integer
            description: 'Filters the data to a brand. Expects an ID that can be retrieved via the /datahub/my/brands endpoint.'
            example: 136
        -
          in: query
          name: 'filter[gtin]'
          description: 'The global identifier for a certain product. You can request for information about up to 1.000 gtins (or eans) seperated by comma.'
          example: '04251422560870'
          required: false
          schema:
            type: string
            description: 'The global identifier for a certain product. You can request for information about up to 1.000 gtins (or eans) seperated by comma.'
            example: '04251422560870'
        -
          in: query
          name: 'filter[manufacturerArticleNumber]'
          description: 'Filters the data to a specific manufacturer article number. Best combined with the brand filter as manufacturer article numbers may not be unique.'
          example: 3391022XL
          required: false
          schema:
            type: string
            description: 'Filters the data to a specific manufacturer article number. Best combined with the brand filter as manufacturer article numbers may not be unique.'
            example: 3391022XL
        -
          in: query
          name: 'filter[productSetId]'
          description: 'Filters the data to a specific product set. A product set includes all GTINs across all sizes and colors in a product.'
          example: 5487.0
          required: false
          schema:
            type: number
            description: 'Filters the data to a specific product set. A product set includes all GTINs across all sizes and colors in a product.'
            example: 5487.0
        -
          in: query
          name: 'filter[colorSetId]'
          description: 'Filters the data to a specific color set.'
          example: 1.0
          required: false
          schema:
            type: number
            description: 'Filters the data to a specific color set.'
            example: 1.0
        -
          in: query
          name: 'filter[season]'
          description: 'Filters the data to a specific season. There are the two values "autumn_winter" and "spring_sumer", followed by a "-" and a year with four digits.'
          example: autumn_winter-2023
          required: false
          schema:
            type: string
            description: 'Filters the data to a specific season. There are the two values "autumn_winter" and "spring_sumer", followed by a "-" and a year with four digits.'
            example: autumn_winter-2023
        -
          in: query
          name: 'filter[updatedAfter]'
          description: 'Filters the response to only include data that has been updated after the given date.'
          example: '2022-06-30'
          required: false
          schema:
            type: string
            description: 'Filters the response to only include data that has been updated after the given date.'
            example: '2022-06-30'
        -
          in: query
          name: 'filter[manufacturerColor]'
          description: 'Filters the data to a specific manufacturer color. Best combined with the brand filter as manufacturer colors may not be unique.'
          example: sulphur-green
          required: false
          schema:
            type: string
            description: 'Filters the data to a specific manufacturer color. Best combined with the brand filter as manufacturer colors may not be unique.'
            example: sulphur-green
