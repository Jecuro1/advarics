.radio{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:1px solid var(--line-2);font-size:13px;cursor:pointer;transition:border-color var(--d-1),background var(--d-1)}
.radio:hover{border-color:var(--line-3)}
.radio input{accent-color:hsl(var(--ah) var(--as) var(--al))}
.radio:has(input:checked){border-color:var(--accent-line);background:var(--accent-soft)}
.radio small{margin-left:auto;color:var(--text-3);font-size:12px}
.check{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--text-2);line-height:1.45;cursor:pointer}
.check input{margin-top:3px;accent-color:hsl(var(--ah) var(--as) var(--al))}

/* Designsystem-Seite */
.ds{padding:30px 32px 60px;max-width:1240px;margin:0 auto}
.ds-sec{margin-top:40px}
.ds-sec>h2{font-size:17px;font-weight:620;letter-spacing:-.015em;display:flex;align-items:center;gap:10px}
.ds-sec>p{font-size:13.5px;color:var(--text-3);margin-top:4px;max-width:72ch;line-height:1.55}
.ds-grid{display:grid;gap:12px;margin-top:16px}
.ds-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ds-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.ds-cols-6{grid-template-columns:repeat(6,minmax(0,1fr))}
.princ{padding:18px}
.princ .reg-ic{margin-bottom:12px;color:var(--accent)}
.princ h3{font-size:14px;font-weight:600}
.princ p{font-size:12.5px;color:var(--text-3);line-height:1.55;margin-top:4px}
.sw-card{overflow:hidden}
.sw-card .sw{height:64px;background:var(--v);border-bottom:1px solid var(--line)}
.sw-card .meta{padding:10px 12px}
.sw-card .t1{font-size:12.5px;font-weight:600}
.sw-card .t2{font:11px/1.4 var(--font-mono);color:var(--text-3)}
.type-row{display:grid;grid-template-columns:150px 1fr;align-items:baseline;gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}
.type-row .k{font:11.5px/1.4 var(--font-mono);color:var(--text-3)}
.comp-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:18px;border-bottom:1px solid var(--line)}
.comp-row:last-child{border-bottom:0}
.comp-row .lbl{width:120px;font-size:12px;color:var(--text-3);flex:none}
.space-viz{display:flex;align-items:flex-end;gap:14px;padding:18px;flex-wrap:wrap}
.space-viz div{display:flex;flex-direction:column;align-items:center;gap:6px;font:11px var(--font-mono);color:var(--text-3)}
.space-viz i{display:block;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:3px}
.layers{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.layers span{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:550}
.layers .i{color:var(--text-4);width:14px;height:14px}
.preset{padding:0;overflow:hidden;text-align:left;transition:border-color var(--d-1),transform var(--d-2) var(--ease-out)}
.preset:hover{border-color:var(--line-3);transform:translateY(-2px)}
.preset[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.preset .pv{height:86px;display:grid;grid-template-columns:28px 1fr;gap:6px;padding:10px}
.preset .pv i{border-radius:5px;display:block}
.preset .meta{padding:10px 12px;border-top:1px solid var(--line)}
.preset .t1{font-size:13px;font-weight:600}
.preset .t2{font-size:11.5px;color:var(--text-3)}
.motion-demo{display:flex;gap:16px;flex-wrap:wrap;padding:18px}
.motion-demo .md{flex:1;min-width:150px}
.motion-demo .trk{height:40px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);position:relative;margin-top:8px}
.motion-demo .ball{position:absolute;top:7px;left:7px;width:24px;height:24px;border-radius:7px;background:var(--accent)}
.motion-demo .k{font:11.5px var(--font-mono);color:var(--text-3)}

/* Einstellungen */
.set{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;padding:28px 32px 80px;max-width:1240px;margin:0 auto}
.set-nav{position:sticky;top:0;align-self:start;display:flex;flex-direction:column;gap:2px;padding-top:4px}
.set-nav button{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:var(--r-sm);color:var(--text-2);font-size:13.5px;font-weight:500;text-align:left;transition:background var(--d-1),color var(--d-1)}
.set-nav button:hover{background:var(--surface-2);color:var(--text)}
.set-nav button .i{color:var(--text-3)}
.set-note{margin-top:14px;padding:10px 12px;font-size:11.5px;color:var(--text-3);display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.set-sec{margin-bottom:36px;scroll-margin-top:20px}
.set-sec>h2{font-size:17px;font-weight:620;letter-spacing:-.015em}
.set-sec>p{font-size:13px;color:var(--text-3);margin:4px 0 14px;max-width:76ch;line-height:1.55}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto);gap:24px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-l{font-size:13.5px;font-weight:550}
.set-h{font-size:12px;color:var(--text-3);margin-top:2px;line-height:1.45;max-width:60ch}
.set-c{display:flex;align-items:center;justify-content:flex-end;min-width:220px}
.set-c .input{width:320px;max-width:100%}
.set-path{font-size:11.5px;color:var(--text-2);max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
@media (max-width:900px){.set{grid-template-columns:1fr;padding:18px 16px 60px}.set-nav{position:static;flex-direction:row;overflow-x:auto}.set-row{grid-template-columns:1fr}.set-c{justify-content:flex-start;min-width:0}}

/* Artikel & Bestand */
.cv{padding:24px 28px 60px;max-width:1500px;margin:0 auto}
.cv-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.cv-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.cv-tools .search-field{height:42px;flex:0 1 380px}
.cv-tools .search-field input{font-size:14px}
.art-tbl{margin:0}
.art-tbl tbody tr{cursor:pointer;animation:none;transition:background var(--d-1)}
.art-tbl tbody tr:hover{background:var(--surface-2)}
.art-tbl td{vertical-align:middle}
.art-tbl .thumb{width:40px;height:40px;border-radius:10px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.kpis .card{padding:12px 16px;min-width:150px}
.kpis b{display:block;font-size:20px;font-weight:650;letter-spacing:-.02em}
.kpis span{font-size:12px;color:var(--text-3)}
.inv{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.inv-card{padding:14px 16px;margin-bottom:12px}
.inv-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.mx{border-collapse:separate;border-spacing:4px;margin:-4px}
.mx th{font-size:11.5px;font-weight:550;color:var(--text-3);text-align:center;padding:0 4px}
.mx th.c{text-align:left;white-space:nowrap;padding-right:10px}
.mx th.c i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.mxc{min-width:52px;height:36px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums;transition:border-color var(--d-1),background var(--d-1),transform var(--d-1)}
.mxc:hover{border-color:var(--accent-line);background:var(--surface-3)}
.mxc:active{transform:scale(.96)}
.mxc.low{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.mxc.out{color:var(--neg);background:var(--neg-soft);border-color:transparent}
.mxc.flash{animation:flash .9s var(--ease-out)}
.mv-panel{position:sticky;top:0;padding:14px 0 6px}
.mv-panel h3{font-size:13.5px;font-weight:600;padding:0 16px 8px}
.mv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 16px;border-top:1px solid var(--line);font-size:12.5px}
.mv b{font-weight:550}
.mv .d{font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.mv .d.p{color:var(--pos)} .mv .d.m{color:var(--neg)}
.mv small{color:var(--text-3);font-size:11.5px}
.ed-sec{margin-top:20px}
.ed-sec>.lab{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ed-grid .full{grid-column:1/-1}
.cpick{display:flex;flex-wrap:wrap;gap:6px}
.cpick button{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px 0 5px;border-radius:999px;border:1px solid var(--line-2);font-size:12.5px;color:var(--text-2)}
.cpick button i{width:20px;height:20px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.cpick button[aria-pressed="true"]{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}
.cpick button .ord{font-size:10px;font-weight:700;color:var(--accent)}
.frow{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin-bottom:6px}
.select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.art-img{width:100%;height:100%;object-fit:cover;display:block}
.tile-media .art-img{position:absolute;inset:0}
.vp-media .art-img{position:absolute;inset:0}
.thumb{overflow:hidden}
.thumb .art-img{border-radius:inherit}
.bon-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
.bon-prev{position:sticky;top:12px;max-height:calc(100dvh - 140px);overflow:auto;background:var(--surface-2)}
@media (max-width:1200px){.bon-grid{grid-template-columns:1fr}.bon-prev{position:static}}
.lb-prev{display:flex;gap:10px;flex-wrap:wrap}
.lb-card{width:210px;height:112px;background:#fff;color:#111;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;box-shadow:var(--shadow-1);font-family:system-ui,sans-serif}
.lb-card .t{font-size:11px;font-weight:700;line-height:1.2;max-height:2.4em;overflow:hidden}
.lb-card .v{font-size:10px;color:#555}
.lb-card .row{display:flex;align-items:flex-end;gap:8px;margin-top:auto}
.lb-card .bc{flex:1;height:44px}
.lb-card b{font-size:15px;white-space:nowrap}
.zr{display:grid;gap:14px}
.zr-sec{display:grid;gap:4px}
.zr-sec .eyebrow{margin-bottom:2px}
.zr .trow{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--text-2);padding:2px 0}
.zr .trow b{color:var(--text);font-weight:550}
.zr .trow.disc b{color:var(--text-3)}
.denoms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.denoms label{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2)}
.denoms label span{min-width:48px;text-align:right}
.denoms .input{height:34px;text-align:right}
@media (max-width:760px){.denoms{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rcpts{width:min(1040px,100%);height:min(700px,calc(100dvh - 48px));display:grid;grid-template-columns:minmax(0,1fr) 380px;overflow:hidden}
.rcpts-l{display:flex;flex-direction:column;min-height:0}
.rcpts-list{flex:1;overflow:auto;padding:0 10px 12px}
@media (max-width:1100px){.inv{grid-template-columns:1fr}.mv-panel{position:static}.rcpts{grid-template-columns:1fr}.rcpts .done-r{display:none}}

/* Platzhalter-Ansichten */
.ph{height:100%;display:grid;place-items:center;padding:40px}
.ph .empty{max-width:520px}
.ph .empty-icon{width:64px;height:64px;border-radius:20px;color:var(--accent)}
.ph .empty h3{font-size:19px;letter-spacing:-.015em}
.ph .empty p{max-width:46ch;font-size:14px}
.ph ul{list-style:none;padding:0;margin:10px 0 6px;display:grid;gap:8px;text-align:left}
.ph li{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--text-2)}
.ph li .i{color:var(--accent);width:16px;height:16px;margin-top:1px}

/* ════════════════════════════════════════════════════════════════════
   9 · RESPONSIV
   ════════════════════════════════════════════════════════════════════ */
@media (max-width:1360px){ .hide-md{display:none!important} }
@media (max-width:1280px){
  :root{--cart-w:372px}
  .tb-search{width:clamp(180px,22vw,300px)}
}
@media (max-width:1200px){
  .w.s{grid-column:span 6}.w.m{grid-column:span 12}.w.tall{grid-column:span 6}.w.wide{grid-column:span 6}.w.l{grid-column:span 12}
  .add-tile{grid-column:span 6}
}
@media (max-width:1100px){
  .pay,.pay-done{grid-template-columns:1fr;height:auto;max-height:calc(100dvh - 48px);overflow:auto}
  .pay-l,.done-r{border:0}
  .ds-cols-6{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ds-cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .app,.app.sb-collapsed{grid-template-columns:0 minmax(0,1fr)}
  .sidebar{position:fixed;z-index:150;left:0;top:0;bottom:0;width:260px;background:var(--frame);transform:translateX(-100%);transition:transform var(--d-3) var(--ease-out);box-shadow:var(--shadow-3)}
  .app.sb-open .sidebar{transform:none}
  .app.sb-collapsed .sidebar .fade-label{opacity:1;transform:none}
  .main{margin:0;border-radius:0;border:0}
  .tb-menu{display:inline-flex}
  .tb-search .lbl,.tb-search .kbds{display:none}
  .tb-search{width:34px;padding:0;justify-content:center}
  .tb-sub{display:none}
  .pos-root{grid-template-columns:1fr}
  .cart{position:fixed;z-index:80;left:0;right:0;bottom:30px;height:min(78dvh,640px);border-left:0;border-top:1px solid var(--line-2);border-radius:20px 20px 0 0;box-shadow:var(--shadow-3);transform:translateY(calc(100% + 40px));transition:transform var(--d-3) var(--ease-out)}
  .cart.open{transform:none}
  .cart-toggle{display:flex;position:fixed;z-index:79;left:12px;right:12px;bottom:40px;height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);align-items:center;gap:10px;padding:0 18px;font-weight:650;box-shadow:var(--shadow-3)}
  .cart-toggle .amt{margin-left:auto}
  .grid-wrap{padding:10px 14px 90px}
  .agrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .pos-head{padding:12px 14px 0}
  .grid-meta{padding:12px 14px 0}
  .fbar{display:none}
  .cart.open + .cart-toggle{opacity:0;pointer-events:none}
  .dgrid{grid-template-columns:1fr}
  .w.s,.w.m,.w.tall,.w.wide,.w.l,.w.xl,.add-tile{grid-column:span 1}
  .dash{padding:18px 16px 40px}
  .hide-sm{display:none!important}
  .vp{grid-template-columns:1fr}
  .vp-media{min-height:220px;border-radius:20px 20px 0 0}
  .ds-cols-3,.ds-cols-4,.ds-cols-6{grid-template-columns:1fr 1fr}
  .methods{grid-template-columns:repeat(2,1fr)}
  .pay-cols{grid-template-columns:1fr}
  .done-r{display:none}
  .inspector{left:12px}
}

/* ════════════════════════════════════════════════════════════════════
   10 · BEWEGUNG — reduziert
   ════════════════════════════════════════════════════════════════════ */
[data-motion="reduced"] *,[data-motion="reduced"] *::before,[data-motion="reduced"] *::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}

  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}

  .w,.tile,.card,.modal,.palette{border:1px solid CanvasText}
}

<script>
(() => {
'use strict';

/* ════════════════════════════════════════════════════════════════════
   1 · HILFSFUNKTIONEN
   ════════════════════════════════════════════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const ic = (n, c = '') => `<svg class="i ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const glyph = (g, color, cls = '') => `<svg class="glyph ${cls}" viewBox="0 0 64 64" style="color:${color}" aria-hidden="true"><use href="#g-${g}"/></svg>`;
const EUR = new Intl.NumberFormat('de-AT', {style: 'currency', currency: 'EUR'});
const EUR0 = new Intl.NumberFormat('de-AT', {style: 'currency', currency: 'EUR', maximumFractionDigits: 0, minimumFractionDigits: 0});
const eur = v => EUR.format(Math.abs(v) < .005 ? 0 : v);
const eur0 = v => EUR0.format(v);
const NF = {};
const num = (v, d = 0) => (NF[d] ||= new Intl.NumberFormat('de-DE', {minimumFractionDigits: d, maximumFractionDigits: d})).format(v);
const pct = (v, d = 1) => `${v > 0.049 ? '+' : v < -0.049 ? '−' : '±'}${num(Math.abs(v), d)} %`;
const r2 = v => Math.round((v + Number.EPSILON) * 100) / 100;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pad = (n, l = 2) => String(n).padStart(l, '0');
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const wait = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Math.random().toString(36).slice(2, 9);
const initials = n => n.split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const reduced = () => document.documentElement.dataset.motion === 'reduced' || matchMedia('(prefers-reduced-motion: reduce)').matches;
const persist = {
  get(k, d) { try { const v = localStorage.getItem('kontor.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('kontor.' + k, JSON.stringify(v)); } catch { /* privat / blockiert */ } },
};
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const MOD = IS_MAC ? '⌘' : 'Strg';
const parseAmt = s => { const v = parseFloat(String(s).trim().replace(/\s|€/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isFinite(v) ? v : NaN; };
const DESKTOP = !!(window.__TAURI__ && window.__TAURI__.core);
const invoke = (cmd, args) => DESKTOP ? window.__TAURI__.core.invoke(cmd, args) : Promise.reject(new Error('Nur in der Desktop-App'));
const isTyping = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);

const NOW = new Date();
const NOW_H = NOW.getHours() + NOW.getMinutes() / 60;
const DEMO_H = NOW_H >= 10 && NOW_H < 18.9 ? NOW_H : 15 + 40 / 60;   // Testdaten: „Stand“ während Öffnungszeit
const hhmm = h => { const hh = Math.floor(h); const mm = Math.floor((h - hh) * 60 + 1e-6); return `${pad(hh)}:${pad(mm)}`; };
const DATE_LONG = NOW.toLocaleDateString('de-AT', {weekday: 'long', day: 'numeric', month: 'long'});
const YEAR = NOW.getFullYear();
const clock = (secs = false) => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}${secs ? ':' + pad(d.getSeconds()) : ''}`; };

/* ════════════════════════════════════════════════════════════════════
   2 · HOOKS — lokaler Ereignisbus
   Jede fachliche Aktion feuert ein Ereignis. Regeln, Skripte (Sandbox),
   Workflows und Webhooks hängen sich daran – die Oberfläche selbst ist
   nur ein weiterer Abonnent.
   ════════════════════════════════════════════════════════════════════ */
const Hooks = {
  map: {}, log: [], count: 0,
  on(evt, fn) { (this.map[evt] ||= []).push(fn); },
  emit(evt, payload = {}) {
    const e = {t: new Date(), evt, payload};
    this.count++; this.log.unshift(e); if (this.log.length > 200) this.log.pop();
    [...(this.map[evt] || []), ...(this.map['*'] || [])].forEach(fn => { try { fn(payload, e); } catch (err) { console.error(err); } });
  },
};
const BINDINGS = [
  {evt: 'pos.sale.completed', kind: 'Webhook', target: 'POST https://erp.alpenlicht.local/hooks/sale', note: 'Ziel freigegeben'},
  {evt: 'pos.line.added', kind: 'Skript', target: 'skiservice-hinweis.js', note: 'Sandbox · ≤ 5 ms'},
  {evt: 'pos.discount.requested', kind: 'Regel', target: 'Rabattfreigabe über 20 %', note: 'Workflow-Designer'},

const layers = [];
function openLayer(inner, {cls = '', onClose, closeOnScrim = true, focus, esc: escClose = true} = {}) {

}

function hl(label, q) {
  const toks = norm(q.replace(/^\?/, '')).split(/\s+/).filter(Boolean); if (!toks.length) return esc(label);

  toks.forEach(t => { const i = nl.indexOf(t); if (i >= 0) for (let j = i; j < i + t.length && j < label.length; j++) marks[j] = true; });
  let out = '', open = false;
  for (let i = 0; i < label.length; i++) {
    if (marks[i] && !open) { out += '<mark>'; open = true; }
    if (!marks[i] && open) { out += '</mark>'; open = false; }
    out += esc(label[i]);
  }
  return out + (open ? '</mark>' : '');
}

function profile(seed, noise) {

const cumul = (total, prof) => { const c = [0]; prof.forEach(p => c.push(c[c.length - 1] + p * total)); return c; };

const storeFactor = () => S.store === 'ALL' ? STORES.reduce((a, s) => a + s.f, 0) : storeObj().f;
function cumulSeries(vals, upto, frac, extra, fcMul = 1.02) {

function setEditing(on, silent) {
  Dash.editing = on;
  const dash = $('#dash'); if (!dash) return;
  dash.classList.toggle('editing', on);
  $$('.w', dash).forEach(w => w.tabIndex = on ? 0 : -1);
  if (!on) { saveLayout(); if (!silent) toast('Layout gespeichert', {t2: `Für ${S.user.name} · Filiale ${storeObj().name}`, type: 'pos', icon: 'layout'}); }
  requestAnimationFrame(() => $('#periodSeg')?._place?.(false));
}
function flip(container, mutate) {
  const items = $$('.w', container), first = new Map(items.map(el => [el, el.getBoundingClientRect()]));
  mutate();
  if (reduced()) return;
  $$('.w', container).forEach(el => { const f = first.get(el); if (!f) return; const l = el.getBoundingClientRect(); const dx = f.left - l.left, dy = f.top - l.top; if (Math.abs(dx) > 1 || Math.abs(dy) > 1) el.animate([{transform: `translate(${dx}px,${dy}px)`}, {transform: 'none'}], {duration: 320, easing: 'cubic-bezier(.16,1,.3,1)'}); });
}
function commitOrder() {
  const order = $$('#dgrid .w').map(el => el.dataset.uid);
  Dash.layout.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  Dash.preset = 'eigene'; saveLayout(); updatePresetLabel();
}
const updatePresetLabel = () => { const b = $('#presetBtn'); if (b) b.innerHTML = `Vorlage: ${esc(PRESETS[Dash.preset]?.name || 'Eigene')}${ic('chevron-down', 'i-sm')}`; };
function startDrag(w, ev) {
  const r = w.getBoundingClientRect();
  const ghost = w.cloneNode(true); ghost.classList.add('drag-ghost'); ghost.classList.remove('enter');
  Object.assign(ghost.style, {left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px'});
  document.body.appendChild(ghost); w.classList.add('placeholder'); document.body.style.cursor = 'grabbing';
  return {w, ghost, dx: ev.clientX - r.left, dy: ev.clientY - r.top, last: null, t: 0};
}
function moveDrag(d, ev) {
  d.ghost.style.left = (ev.clientX - d.dx) + 'px'; d.ghost.style.top = (ev.clientY - d.dy) + 'px';
  const view = $('#view-dashboard'), vr = view.getBoundingClientRect();
  if (ev.clientY < vr.top + 70) view.scrollTop -= 14; else if (ev.clientY > vr.bottom - 70) view.scrollTop += 14;
  const t = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('#dgrid .w');
  if (!t || t === d.w) { d.last = null; return; }
  const now = performance.now(); if (t === d.last || now - d.t < 140) return;
  d.last = t; d.t = now;
  const g = $('#dgrid'), kids = [...g.children];
  flip(g, () => { kids.indexOf(d.w) < kids.indexOf(t) ? t.after(d.w) : t.before(d.w); });
}
function endDrag(d) {
  const r = d.w.getBoundingClientRect();
  const a = d.ghost.animate([{left: d.ghost.style.left, top: d.ghost.style.top, transform: 'rotate(.8deg) scale(1.015)'}, {left: r.left + 'px', top: r.top + 'px', transform: 'none'}], {duration: reduced() ? 1 : 220, easing: 'cubic-bezier(.16,1,.3,1)'});
  a.onfinish = () => { d.ghost.remove(); d.w.classList.remove('placeholder'); };
  document.body.style.cursor = '';
  commitOrder();
}
function bindDashboard() {
  const v = $('#view-dashboard');
  v.addEventListener('pointerdown', e => {
    if (!Dash.editing || e.button !== 0) return;
    const w = e.target.closest('#dgrid .w'); if (!w || e.target.closest('.w-edit')) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY; let drag = null;
    const move = ev => { if (!drag) { if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 5) return; drag = startDrag(w, ev); } moveDrag(drag, ev); };
    const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); if (drag) endDrag(drag); };
    addEventListener('pointermove', move); addEventListener('pointerup', up);
  });
  v.addEventListener('keydown', e => {
    if (!Dash.editing || !e.altKey) return;

const POS = {cart: [], customer: null, sel: null, cat: 'alle', q: '', kb: -1, list: [], billDisc: null, parked: [], no: 4718, last: null, lastKey: null, lastNew: false, shown: 0,
  flow: {clubRule: true, prompts: true, approval: true, approvalPct: 20}};

function totals() {
  let sub = 0, ldisc = 0; const byRate = {};
  POS.cart.forEach(l => { const g = r2(l.unit * l.qty), d = l.disc ? r2(g * l.disc.pct / 100) : 0; sub += g; ldisc += d; byRate[l.vat] = (byRate[l.vat] || 0) + g - d; });
  let bdisc = 0;
  if (POS.billDisc) Object.keys(byRate).forEach(k => { if (+k > 0) { const d = r2(byRate[k] * POS.billDisc.pct / 100); byRate[k] -= d; bdisc += d; } });
  const total = r2(sub - ldisc - bdisc);
  const vat = Object.entries(byRate).filter(([k, g]) => +k > 0 && g > 0).map(([k, g]) => ({rate: +k, gross: r2(g), net: r2(g / (1 + k / 100)), tax: r2(g - g / (1 + k / 100))}));
  return {sub: r2(sub), disc: r2(ldisc + bdisc), total, vat, zero: r2(byRate[0] || 0), points: Math.floor(total / 10)};
}

  };

    if (c) { st.c = c.dataset.c; if (variant(a, st.c, st.s).q === 0) st.s = firstAvail(st.c); render(`[data-c="${st.c}"]`); }
    else if (s) { st.s = s.dataset.s; render(`[data-s="${CSS.escape(st.s)}"]`); }
    else if (q) { st.qty = clamp(st.qty + +q.dataset.q, 1, 99); render(`[data-q="${q.dataset.q}"]`); }
    else if (e.target.closest('#vpAdd')) add();
  });
  box.addEventListener('input', e => { const p = e.target.dataset.p; if (p) st.vals[p] = e.target.value; });
  el.addEventListener('keydown', e => {
    const inField = isTyping(e.target);
    if (e.key === 'Enter' && !e.target.closest('[data-close]')) { e.preventDefault(); return add(); }
    if (inField) return;
    const si = a.sizes.indexOf(st.s), ci = a.colors.indexOf(st.c);
    if (e.key === 'ArrowRight' && !oneSize) { st.s = a.sizes[Math.min(a.sizes.length - 1, si + 1)]; render(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' && !oneSize) { st.s = a.sizes[Math.max(0, si - 1)]; render(); e.preventDefault(); }
    else if (e.key === 'ArrowDown' && a.colors.length > 1) { st.c = a.colors[(ci + 1) % a.colors.length]; render(); e.preventDefault(); }

    else if (e.key === '+') { st.qty = Math.min(99, st.qty + 1); render(); }
    else if (e.key === '-') { st.qty = Math.max(1, st.qty - 1); render(); }
  });

}

  };
}
function bindSettings() {

    const acc = t.closest('[data-acc]'); if (acc) { prefs.accent = acc.dataset.acc; applyPrefs(true); $$('[data-acc],.swb.custom', v).forEach(b => b.setAttribute('aria-pressed', b === acc)); return; }
    const op = t.closest('[data-open]'); if (op) return invoke('open_folder', {path: op.dataset.open}).catch(err => toast('Ordner nicht verfügbar', {t2: String(err), type: 'warn'}));
    if (t.closest('#bkNow')) return realBackup('manuell');

    const bk = t.closest('[data-bk]');
    if (bk) {
      const tr = bk.closest('tr'), path = tr.dataset.path;
      if (bk.dataset.bk === 'verify') { const st = $('.bk-st', tr); st.innerHTML = '<span class="pill">prüfe …</span>'; let c = await invoke('backup_verify', {path}); if (c.needs_password) { const pw = await askPassword('Sicherung ist verschlüsselt', 'Sicherungspasswort eingeben'); if (pw) c = await invoke('backup_verify', {path, password: pw}); } st.innerHTML = `<span class="pill ${c.ok ? 'pos' : 'neg'}" title="${esc(c.message)}">${ic(c.ok ? 'check' : 'alert')}${c.ok ? 'in Ordnung' : 'fehlerhaft'}</span>`; toast(c.ok ? 'Sicherung in Ordnung' : 'Sicherung fehlerhaft', {t2: c.message, type: c.ok ? 'pos' : 'warn'}); }
      else restoreFlow(path, tr);
    }
  });

}
function renderUpdBits() { renderStatus(); renderUpdSection(); refreshDashboard(['ops.system']); }
async function checkUpdates(manual) {
  if (!DESKTOP || UPD.state === 'checking') return;

    const i = await invoke('update_check', {channel: CFG['update.kanal'] || 'stable'});

  } catch (e) {

    UPD.state = 'error'; UPD.error = String(e);

}
function notesHTML(md) {
  if (!md) return '<p class="muted" style="font-size:13px">Keine Hinweise angegeben.</p>';
  let out = /sicherheit/i.test(md) ? `<div class="rule-box" style="margin-bottom:10px">${ic('shield')}<div><b style="color:var(--text)">Sicherheitsupdate</b> – bitte zeitnah freigeben und installieren.</div></div>` : '', list = false;
  md.split(/\r?\n/).forEach(l => {

function openRealUpdate() {

    try { await stepUp({title: 'Update freigeben', text: `Kontor ${i.version} installieren.`, rule: 'Updates erfordern eine Freigabe mit PIN oder Sicherheitsschlüssel'}); } catch { return; }
    closeLayer(el);

}
function scheduleApproved(ap) {
  clearTimeout(UPD.timer);
  if (ap.when === 'start' && new Date(ap.at) < new Date(Date.now() - 60e3)) return runInstall(true);
  if (ap.when === 'abend') {

      <div class="card"><b>${buyers ? eur(rev / buyers) : '–'}</b><span>Ø je kaufende:r Kund:in</span></div></div>
    <div class="cv-tools"><label class="search-field">${ic('search')}<input id="kuQ" placeholder="Name, Kundennummer, E-Mail oder Telefon …" value="${esc(KV.q)}" autocomplete="off"></label>
      <div class="seg" id="kuSeg">${[['alle', 'Alle'], ['club', 'Gipfel-Club'], ['verein', 'Verein'], ['news', 'Newsletter']].map(([k, l]) => `<button data-v="${k}" aria-pressed="${KV.f === k}">${l}</button>`).join('')}</div></div>
    <div class="card" id="kuTable"></div></div>`;
  initSeg($('#kuSeg', v), b => { KV.f = b.dataset.v; renderKuTable(); });
  renderKuTable();
}
function custMatches(c, toks) { const hay = norm(`${c.name} ${c.id} ${c.email} ${c.phone} ${c.tier} ${c.club?.name || ''}`); return toks.every(t => hay.includes(t)); }
function renderKuTable() {
  const toks = norm(KV.q.trim()).split(/\s+/).filter(Boolean);
  const list = CUSTOMERS.filter(c => custMatches(c, toks) && (KV.f === 'alle' || (KV.f === 'club' && /club/i.test(c.tier)) || (KV.f === 'verein' && c.club) || (KV.f === 'news' && c.consent)));
  $('#kuCount').textContent = `${list.length} von ${CUSTOMERS.length} Kund:innen · ${DESKTOP ? 'lokale Datenbank' : 'Vorschau'}`;
  $('#kuTable').innerHTML = list.length ? `<table class="tbl art-tbl"><thead><tr><th style="padding-left:16px;width:52px"></th><th>Kunde</th><th>Kontakt</th><th>Stufe</th><th class="r">Punkte</th><th class="r">Einkäufe</th><th class="r">Umsatz</th><th>Zuletzt</th><th></th></tr></thead><tbody>${list.map(c => `
    <tr data-cust="${esc(c.id)}"><td style="padding-left:16px"><span class="avatar" style="--h:${c.hue}">${initials(c.name)}</span></td>
      <td><div style="font-weight:600">${esc(c.name)}</div><div class="muted" style="font-size:12px">${esc(c.id)}${c.consent ? " · Newsletter" : ""}</div></td>
      <td class="muted" style="font-size:12.5px">${esc(c.email || '–')}${c.phone ? `<br>${esc(c.phone)}` : ''}</td>
      <td><span class="pill ${/gold/i.test(c.tier) ? 'accent' : ''}" style="height:20px">${esc(c.tier)}</span>${c.club ? ` <span class="pill info" style="height:20px">${ic('flow')}−${c.club.pct} %</span>` : ''}</td>
      <td class="r num"><b>${num(c.points)}</b></td><td class="r num">${num(c.visits || 0)}</td><td class="r"><b>${eur(c.revenue || 0)}</b></td>
      <td class="muted">${esc(c.last)}</td><td class="r" style="padding-right:14px;color:var(--text-3)">${ic('chevron-right', 'i-sm')}</td></tr>`).join('')}</tbody></table>`
    : `<div class="empty" style="padding:56px 20px"><div class="empty-icon">${ic('users')}</div><h3>${CUSTOMERS.length ? 'Kein Treffer' : 'Noch keine Kund:innen'}</h3><p>${CUSTOMERS.length ? 'Suche oder Filter anpassen.' : 'Kund:innen hier oder direkt an der Kasse (F3 → Neu anlegen) erfassen.'}</p></div>`;
}

/* ── Anlegen / Bearbeiten ── */
function openCustomerEditor(c, {prefill = '', onSaved} = {}) {
  const isNew = !c;
  const pre = prefill.trim(), preMail = pre.includes('@');
  const st = c ? {street: c.street || '', zip: c.zip || '', city: c.city || '', country: c.country || 'AT', uid: c.uid || '', name: c.name, email: c.email, phone: c.phone, tier: c.tier, clubName: c.club?.name || '', clubPct: c.club ? String(c.club.pct) : '', consent: c.consent, note: c.note || '', fields: Object.entries(c.fields || {})}
    : {street: '', zip: '', city: '', country: 'AT', uid: '', name: preMail ? '' : pre, email: preMail ? pre : '', phone: '', tier: 'Kunde', clubName: '', clubPct: '', consent: false, note: '', fields: []};
  const el = openLayer(`<div class="drawer-panel" style="width:min(580px,100%)" role="dialog" aria-modal="true" aria-label="${isNew ? 'Neuer Kunde' : 'Kunde bearbeiten'}"><div id="ceHead"></div><div class="drawer-body" id="ceBody"></div>
    <div class="m-foot" style="border-top:1px solid var(--line);padding-top:14px">${isNew ? '' : `<button class="btn btn-danger" id="ceDel">${ic('trash', 'i-sm')}Deaktivieren</button>`}<span class="sp"></span><button class="btn btn-secondary" data-close>Abbrechen</button><button class="btn btn-primary" id="ceSave">${ic('check', 'i-sm')}${isNew && onSaved ? 'Anlegen & zuordnen' : 'Speichern'}</button></div></div>`, {cls: 'drawer', focus: st.name ? '[data-f="email"]' : '[data-f="name"]'});
  const collect = () => {
    $$('[data-f]', el).forEach(i => { st[i.dataset.f] = i.value; });
    st.fields = $$('.frow', el).map(r => [$('[data-fk]', r).value.trim(), $('[data-fv]', r).value.trim()]);
  };
  const tiers = TIERS.includes(st.tier) ? TIERS : [st.tier, ...TIERS];
  const render = () => {
    $('#ceHead', el).innerHTML = `<div class="m-head" style="padding-bottom:14px"><span class="avatar lg" style="--h:${c ? c.hue : 26}">${st.name.trim() ? initials(st.name) : ic('user-plus', 'i-sm')}</span><div><h2>${isNew ? 'Neue:r Kund:in' : esc(st.name)}</h2><p>${isNew ? 'Kundennummer wird beim Speichern vergeben' : `${esc(c.id)} · ${num(c.points)} Punkte · ${num(c.visits || 0)} Einkäufe`}</p></div><button class="btn btn-ghost btn-icon x" data-close aria-label="Schließen">${ic('x')}</button></div>`;
    $('#ceBody', el).innerHTML = `
      <div class="ed-grid">
        <label class="field full"><span>Name <b class="req">*</b></span><input class="input" data-f="name" value="${esc(st.name)}" placeholder="Vor- und Nachname" autocomplete="off"></label>
        <label class="field"><span>E-Mail</span><input class="input" data-f="email" type="email" value="${esc(st.email)}" placeholder="für digitale Belege" autocomplete="off"></label>
        <label class="field"><span>Telefon</span><input class="input" data-f="phone" value="${esc(st.phone)}" autocomplete="off"></label>
        <label class="field full"><span>Straße</span><input class="input" data-f="street" value="${esc(st.street)}" autocomplete="off"></label>
        <label class="field"><span>PLZ / Ort</span><span style="display:flex;gap:6px"><input class="input" data-f="zip" value="${esc(st.zip)}" style="width:90px"><input class="input" data-f="city" value="${esc(st.city)}"></span></label>
        <label class="field"><span>Land / UID (Firmen)</span><span style="display:flex;gap:6px"><input class="input" data-f="country" value="${esc(st.country)}" style="width:70px"><input class="input" data-f="uid" value="${esc(st.uid)}" placeholder="ATU…"></span></label>
        <label class="field"><span>Kundenstufe</span><select class="input select" data-f="tier">${tiers.map(t => `<option ${t === st.tier ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>
        <div></div>
        <label class="field"><span>Verein</span><input class="input" data-f="clubName" value="${esc(st.clubName)}" placeholder="z. B. SV Inntal"></label>
        <label class="field"><span>Vereinsrabatt %</span><input class="input num" data-f="clubPct" inputmode="numeric" value="${esc(st.clubPct)}" placeholder="0"></label>
        <label class="field full"><span>Notiz</span><textarea class="input" data-f="note" rows="2" style="height:auto;padding-top:9px;resize:vertical">${esc(st.note)}</textarea></label>
      </div>
      <div class="ed-sec"><div class="set-row" style="padding:12px 14px;border:1px solid var(--line);border-radius:12px"><div><div class="set-l">Newsletter & Angebote (Einwilligung)</div><div class="set-h">DSGVO: nur mit ausdrücklicher Zustimmung · jederzeit widerrufbar</div></div><div class="set-c" style="min-width:0"><button type="button" class="switch" role="switch" id="ceConsent" aria-checked="${st.consent}" aria-label="Einwilligung Newsletter"></button></div></div></div>
      <div class="ed-sec"><div class="lab">Eigene Felder <button type="button" class="btn btn-ghost btn-sm" id="ceAddF">${ic('plus', 'i-sm')}Feld</button></div>
        <div>${st.fields.map(([k, val]) => `<div class="frow"><input class="input" data-fk value="${esc(k)}" placeholder="Feld, z. B. Schuhgröße"><input class="input" data-fv value="${esc(val)}" placeholder="Wert"><button type="button" class="btn btn-ghost btn-icon" data-rmf aria-label="Feld entfernen">${ic('x', 'i-sm')}</button></div>`).join('') || '<div class="muted" style="font-size:12.5px">z. B. Schuhgröße, Skilänge, Konfektion – erscheinen an der Kasse beim Zuordnen.</div>'}</div></div>`;
  };
  el.addEventListener('click', async e => {
    const t = e.target;
    if (t.closest('#ceAddF')) { collect(); st.fields.push(['', '']); render(); $$('[data-fk]', el).pop()?.focus(); return; }
    const rmf = t.closest('[data-rmf]'); if (rmf) { collect(); st.fields.splice($$('.frow', el).indexOf(rmf.closest('.frow')), 1); return render(); }
    if (t.closest('#ceConsent')) { st.consent = !st.consent; $('#ceConsent', el).setAttribute('aria-checked', st.consent); return; }
    if (t.closest('#ceDel')) {
      try { await stepUp({title: 'Kund:in deaktivieren', text: `${c.name} wird aus Suche und Kasse entfernt. Belege bleiben aus rechtlichen Gründen erhalten.`}); } catch { return; }
      try { if (DESKTOP) await invoke('customer_delete', {id: c.id, user: S.user.name}); } catch (err) { return toast('Fehler', {t2: String(err), type: 'warn'}); }
      CUSTOMERS.splice(CUSTOMERS.indexOf(c), 1); if (POS.customer === c) detachCustomer();
      closeLayer(el); $$('.layer').forEach(l => l.querySelector('[data-cdetail]') && closeLayer(l));
      if (S.view === 'kunden') renderKunden();
      toast('Kund:in deaktiviert', {t2: c.name, icon: 'trash'}); Hooks.emit('customer.deactivated', {kunde: c.id}); return;
    }
    if (t.closest('#ceSave')) {
      collect();
      const fail = msg => toast(msg, {type: 'warn', icon: 'alert'});
      if (st.name.trim().length < 2) return fail('Name fehlt');
      if (st.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(st.email.trim())) return fail('E-Mail-Adresse ist ungültig');
      const pct = st.clubName.trim() ? parseInt(st.clubPct || '0', 10) : null;
      if (st.clubName.trim() && !(pct >= 0 && pct <= 50)) return fail('Vereinsrabatt: 0 bis 50 %');
      const data = {id: c?.id || '', name: st.name.trim(), email: st.email.trim(), phone: st.phone.trim(), tier: st.tier, points: c?.points || 0,
        club: st.clubName.trim() ? {name: st.clubName.trim(), pct} : null, consent: st.consent, note: st.note.trim(), fields: Object.fromEntries(st.fields.filter(([k]) => k)),
        street: st.street.trim(), zip: st.zip.trim(), city: st.city.trim(), country: st.country.trim() || 'AT', uid: st.uid.trim()};
      const btn = $('#ceSave', el); btn.disabled = true;
      let saved;
      try {
        if (DESKTOP) saved = custFromDb(await invoke('customer_save', {customer: custToDb(data), user: S.user.name}));
        else saved = custFinish({...(c || {visits: 0, revenue: 0}), ...data, id: c?.id || `K-${11600 + CUSTOMERS.length + 1}`});
      } catch (err) { btn.disabled = false; return fail(String(err)); }
      if (c) { Object.assign(c, saved); saved = c; } else CUSTOMERS.unshift(saved);
      closeLayer(el);
      if (S.view === 'kunden') renderKunden();
      if (POS.customer === saved) renderCart();
      toast(isNew ? 'Kund:in angelegt' : 'Gespeichert', {t2: `${saved.name} · ${saved.id}`, type: 'pos', icon: 'user'});
      Hooks.emit('customer.saved', {kunde: saved.id, neu: isNew});
      onSaved && onSaved(saved);
    }
  });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); $('#ceSave', el).click(); } });
  render();
}

function openPointsAdjust(c, done) {
  if (!DESKTOP) return toast('Nur in der Desktop-App', {t2: 'Punkte werden in der lokalen Datenbank geführt', type: 'warn', icon: 'star'});
  const st = {sign: 1, qty: '', reason: 'Kulanz'};
  const el = openLayer(`<div class="modal" style="width:min(460px,100%)" role="dialog" aria-modal="true" aria-label="Punkte korrigieren"><div id="ptBody"></div></div>`, {focus: '#ptQty'});
  const box = $('#ptBody', el);
  const render = () => {
    const n = parseInt(st.qty, 10) || 0, after = Math.max(0, c.points + st.sign * n);
    box.innerHTML = `<div class="m-head"><div class="m-ic">${ic('star')}</div><div><h2>Punkte korrigieren</h2><p>${esc(c.name)} · Stand ${num(c.points)}</p></div><button class="btn btn-ghost btn-icon x" data-close aria-label="Schließen">${ic('x')}</button></div>
      <div class="m-body" style="display:grid;gap:16px">
        <div class="seg" id="ptSeg" style="justify-self:start"><button data-v="1" aria-pressed="${st.sign === 1}">Gutschreiben</button><button data-v="-1" aria-pressed="${st.sign === -1}">Abziehen</button></div>
        <div class="amt-field"><label for="ptQty">Punkte</label><div class="amt-input"><span>${st.sign > 0 ? '+' : '−'}</span><input id="ptQty" inputmode="numeric" value="${esc(st.qty)}" placeholder="0" autocomplete="off"></div></div>
        <div><div class="field"><span>Grund · wird protokolliert</span></div><div class="reasons" style="margin-top:6px">${['Kulanz', 'Aktion', 'Nachtrag Einkauf', 'Einlösung', 'Korrektur'].map(r => `<button class="chip" data-r="${r}" aria-pressed="${r === st.reason}">${r}</button>`).join('')}</div></div>
        <div class="preview-box"><span>Neuer Stand</span><b class="num">${num(c.points)} → ${num(after)}</b></div>
        <div class="prompt-hint">${ic('shield', 'i-xs')}Manuelle Korrekturen erfordern eine Freigabe durch die Filialleitung.</div>
      </div>
      <div class="m-foot"><span class="sp"></span><button class="btn btn-secondary" data-close>Abbrechen</button><button class="btn btn-primary" id="ptGo" ${n > 0 ? '' : 'disabled'}>${ic('shield', 'i-sm')}Freigeben & buchen</button></div>`;
    initSeg($('#ptSeg', box), b => { st.sign = +b.dataset.v; render(); $('#ptQty', box).focus(); });
  };
  const go2 = async () => {
    const n = parseInt(st.qty, 10); if (!(n > 0)) return;
    let ok; try { ok = await stepUp({title: 'Punkte korrigieren', text: `${st.sign > 0 ? '+' : '−'}${n} Punkte für ${c.name} (${st.reason})`}); } catch { return; }
    try { c.points = await invoke('customer_points', {id: c.id, delta: st.sign * n, reason: st.reason, user: S.user.name, approvedBy: ok.by.name}); }
    catch (e) { return toast('Buchung fehlgeschlagen', {t2: String(e), type: 'warn'}); }
    closeLayer(el); toast('Punkte gebucht', {t2: `${c.name} · neuer Stand ${num(c.points)}`, type: 'pos', icon: 'star'});
    Hooks.emit('loyalty.points.adjusted', {kunde: c.id, punkte: st.sign * n, grund: st.reason});
    done && done();
  };
  box.addEventListener('input', e => { if (e.target.id === 'ptQty') { st.qty = e.target.value.replace(/\D/g, '').slice(0, 6); render(); const i = $('#ptQty', box); i.focus(); i.setSelectionRange(st.qty.length, st.qty.length); } });
  box.addEventListener('click', e => { const r = e.target.closest('[data-r]'); if (r) { st.reason = r.dataset.r; render(); } if (e.target.closest('#ptGo')) go2(); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go2(); } });
  render();
}

function bindCustomers() {
  const v = $('#view-kunden');
  v.addEventListener('input', e => { if (e.target.id === 'kuQ') { KV.q = e.target.value; renderKuTable(); } });
  v.addEventListener('click', e => {
    if (e.target.closest('#kuNew')) return openCustomerEditor(null, {onSaved: c => openCustomerDetail(c)});
    const r = e.target.closest('[data-cust]'); if (r) { const c = custById(r.dataset.cust); c && openCustomerDetail(c); }
  });
}

/* ════════════════════════════════════════════════════════════════════
   19 · BELEGE, RETOUREN, STORNO
   Erstattungsbeträge rechnet die Datenbank aus dem Originalbeleg; die
   Oberfläche wählt nur Positionen und Stückzahlen. Jede Retoure ist ein
   eigener Beleg mit negativem Betrag und Verweis auf das Original.
   ════════════════════════════════════════════════════════════════════ */
const RETURN_REASONS = ['Größe passt nicht', 'Gefällt nicht', 'Defekt / Reklamation', 'Falscher Artikel', 'Kulanz'];
const kindLabel = s => ({retoure: 'Retoure', storno: 'Storno', startbeleg: 'Startbeleg', nullbeleg: 'Nullbeleg', monatsbeleg: 'Monatsbeleg'})[s.kind || s.data?.kind] || 'Bon';
const normBeleg = raw => {
  const s = String(raw).trim().replace(/\s/g, '');
  let m = /^(\d{4})-(\d{1,6})$/.exec(s); if (m) return `${m[1]}-${pad(+m[2], 6)}`;
  m = /^(\d{1,6})$/.exec(s); if (m) return `${YEAR}-${pad(+m[1], 6)}`;
  return s;
};
function applyStocks(stocks) { (stocks || []).forEach(({ean, stock}) => { for (const a of ART) { const v = a.variants.find(x => x.ean === ean); if (v) { v.q = stock; finishArt(a); } } }); }

/* ── Retoure / Storno ── */
async function openReturn(no, {storno = false, onDone} = {}) {
  if (!DESKTOP) return openReturnStart();
  let info;
  try { info = await invoke('sale_get', {no}); } catch (e) { return toast('Beleg nicht gefunden', {t2: String(e), type: 'warn', icon: 'receipt'}); }
  const sale = info.sale, d = sale.data || {};
  if ((sale.kind || 'verkauf') !== 'verkauf') return toast(`${kindLabel(sale)} ${sale.no} kann nicht retourniert werden`, {t2: 'Bitte den ursprünglichen Verkaufsbeleg verwenden', type: 'warn'});
  if (sale.voided) return toast(`Bon ${sale.no} ist bereits storniert`, {type: 'warn', icon: 'receipt'});
  const lines = d.lines || [];
  const open = lines.map((l, i) => l.qty - (info.returned[i] || 0));
  if (!open.some(n => n > 0)) return toast(`Bon ${sale.no} ist vollständig retourniert`, {type: 'warn', icon: 'undo'});
  if (storno && Object.keys(info.returned).length) { toast('Storno nicht mehr möglich', {t2: 'Zu diesem Bon gibt es bereits Retouren – restliche Positionen per Retoure', type: 'warn'}); storno = false; }
  const unitEff = lines.map((l, i) => info.effective[i] / Math.max(1, l.qty));
  const methods = [{m: 'bar', label: 'Bar'}];
  (d.parts || []).forEach(p => { if (p.m !== 'bar' && ['bankomat', 'kredit', 'apple', 'google'].includes(p.m) && !methods.some(x => x.m === p.m)) methods.push({m: p.m, label: p.label}); });
  methods.push({m: 'gutschein', label: 'Gutschein (neu)'});
  const st = {mode: storno ? 'storno' : 'retoure', qty: lines.map((l, i) => storno ? open[i] : (open.length === 1 || lines.length === 1 ? open[i] : 0)), reason: storno ? 'Fehlbon' : RETURN_REASONS[0], method: methods[methods.length > 2 && (d.parts || []).length === 1 && methods[1].m === d.parts[0].m ? 1 : 0], busy: false};
  const limit = +CFG['kasse.retoureGrenze'] || 100;
  const el = openLayer(`<div class="modal" style="width:min(720px,100%)" role="dialog" aria-modal="true" aria-label="Retoure"><div id="rtBody" style="display:flex;flex-direction:column;min-height:0;max-height:calc(100dvh - 48px)"></div></div>`, {closeOnScrim: false});
  const box = $('#rtBody', el);
  const refund = () => st.mode === 'storno' ? sale.total / 100 : r2(lines.reduce((s, l, i) => s + unitEff[i] * st.qty[i], 0) / 100);
  const render = () => {
    const sum = refund(), n = st.qty.reduce((a, b) => a + b, 0), needs = st.mode === 'storno' || sum > limit;
    box.innerHTML = `<div class="m-head"><div class="m-ic" style="color:${st.mode === 'storno' ? 'var(--neg)' : 'var(--accent)'}">${ic(st.mode === 'storno' ? 'x' : 'undo')}</div><div><h2>${st.mode === 'storno' ? 'Bon stornieren' : 'Retoure'} · Bon ${esc(sale.no)}</h2><p>${esc(fmtTs(sale.ts))} · ${eur(sale.total / 100)}${d.customer ? ' · ' + esc(d.customer.name) : ''}${info.refunded ? ` · bereits erstattet ${eur(info.refunded / 100)}` : ''}</p></div><button class="btn btn-ghost btn-icon x" data-close aria-label="Schließen">${ic('x')}</button></div>
      <div class="m-body" style="display:grid;gap:16px;overflow:auto">
        ${Object.keys(info.returned).length ? '' : `<div class="seg" id="rtSeg" style="justify-self:start"><button data-v="retoure" aria-pressed="${st.mode === 'retoure'}">Retoure (einzelne Positionen)</button><button data-v="storno" aria-pressed="${st.mode === 'storno'}">Storno (ganzer Bon)</button></div>`}
        <div class="card" style="overflow:hidden">${lines.map((l, i) => {
          const c = l.c ? COLORS[l.c]?.[1] || 'var(--text-3)' : 'var(--text-3)', done = info.returned[i] || 0;
          return `<div class="wl-row" style="padding:10px 14px;border-bottom:1px solid var(--line);${open[i] <= 0 ? 'opacity:.5' : ''}"><span class="thumb" style="--c:${c}">${l.service ? ic(l.icon || 'bag', 'i-sm') : glyph(l.glyph || 'shirt', c)}</span>

        }).join('')}</div>

        <div><div class="field"><span>Erstattung über</span></div><div class="reasons" style="margin-top:6px">${methods.map((m, i) => `<button class="chip" data-m="${i}" aria-pressed="${m === st.method}">${ic(m.m === 'bar' ? 'cash' : m.m === 'gutschein' ? 'gift' : 'card', 'i-xs')}${esc(m.label)}${['bar', 'gutschein'].includes(m.m) ? '' : ' (Rückbuchung)'}</button>`).join('')}</div></div>
        <div class="preview-box"><span>${st.mode === 'storno' ? 'Erstattung' : `${n} Artikel retour`}<br><span class="muted" style="font-size:12px">${st.method.m === 'bar' ? 'aus Lade 1 auszahlen' : st.method.m === 'gutschein' ? 'als neuer Gutschein (Code wird vergeben)' : 'auf das Zahlungsmittel zurückbuchen'}${d.customer ? ' · Punkte werden anteilig abgezogen' : ''}</span></span><b style="color:var(--neg)">− ${eur(sum)}</b></div>
        ${needs ? `<div class="rule-box">${ic('shield')}<div>${st.mode === 'storno' ? 'Stornos' : `Erstattungen über ${eur0(limit)}`} erfordern eine Freigabe durch die Filialleitung.</div></div>` : ''}

  };

    let by = null;
    if (st.mode === 'storno' || sum > limit) {

    }

/* Bon einer Retoure / eines Stornos */
function returnReceiptHTML(rec, tpl) {
  const dt = rec.date, d = `${pad(dt.getDate())}.${pad(dt.getMonth() + 1)}.${dt.getFullYear()} ${pad(dt.getHours())}:${pad(dt.getMinutes())}:${pad(dt.getSeconds())}`;

const ST = {cache: {}, pending: {}, d28: null, d28p: null};
function statsInvalidate() { ST.cache = {}; ST.d28 = null; if (S.view === 'dashboard' && !Dash.editing) setTimeout(() => renderWidgets(false), 50); }
const isoL = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
if (DESKTOP) { PNAME.saison = 'Jahr'; PLBL.saison = 'dieses Jahr'; }

function periodSpec(p) {
  const now = new Date(), sod = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const DN = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'], MN = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
  if (p === 'heute') {
    const xOf = (ts, base) => (new Date(ts) - base) / 36e5;
    return {cur: [sod, addDays(sod, 1)], prev: [addDays(sod, -7), addDays(sod, -6)], xOf, step: .25, nowX: xOf(now, sod), xMax: 24, cmpLbl: 'Vorwoche', nowLbl: 'Heute',
      fx: x => `${pad(Math.round(x))}:00`, fxTip: x => `${hhmm(x)} Uhr`, ticks: (a, b) => { const out = [], st = b - a > 10 ? 3 : 2; for (let x = Math.ceil(a / st) * st; x <= b; x += st) out.push(x); return out; }, goalDays: 1};
  }
  if (p === 'woche') {
    const mon = addDays(sod, -((now.getDay() + 6) % 7)), xOf = (ts, base) => (new Date(ts) - base) / 864e5;
    return {cur: [mon, addDays(mon, 7)], prev: [addDays(mon, -7), mon], xOf, step: 1 / 8, nowX: xOf(now, mon), xMin: 0, xMax: 7, cmpLbl: 'Vorwoche', nowLbl: 'Diese Woche',
      fx: x => DN[Math.floor(x)], fxTip: x => x === 0 ? 'Wochenbeginn' : `${DN[Math.min(6, Math.ceil(x) - 1)]}${x % 1 ? ' ' + hhmm((x % 1) * 24) : ' · Tagesende'}`, ticks: () => DN.map((_, i) => i + .5), goalDays: 6};
  }
  if (p === 'monat') {
    const first = new Date(now.getFullYear(), now.getMonth(), 1), next = new Date(now.getFullYear(), now.getMonth() + 1, 1), prevFirst = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const dim = Math.round((next - first) / 864e5), xOf = (ts, base) => (new Date(ts) - base) / 864e5;
    const work = Array.from({length: dim}, (_, i) => new Date(now.getFullYear(), now.getMonth(), i + 1).getDay()).filter(d => d !== 0).length;
    const mName = now.toLocaleDateString('de-AT', {month: 'short'});
    return {cur: [first, next], prev: [prevFirst, first], xOf, step: .25, nowX: xOf(now, first), xMin: 0, xMax: dim, cmpLbl: 'Vormonat', nowLbl: 'Dieser Monat',
      fx: x => `${Math.round(x + .5)}.`, fxTip: x => x === 0 ? 'Monatsbeginn' : `${Math.ceil(x)}. ${mName}`, ticks: () => [1, 5, 10, 15, 20, 25, dim].map(x => x - .5), goalDays: work};
  }
  const jan = new Date(now.getFullYear(), 0, 1), nextJan = new Date(now.getFullYear() + 1, 0, 1), prevJan = new Date(now.getFullYear() - 1, 0, 1);
  const xOf = (ts, base) => { const d = new Date(ts), y0 = base.getFullYear(); const m = (d.getFullYear() - y0) * 12 + d.getMonth(); const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); return m + (d.getDate() - 1 + d.getHours() / 24) / dim; };
  return {cur: [jan, nextJan], prev: [prevJan, jan], xOf, step: 1 / 4, nowX: xOf(now, jan), xMin: 0, xMax: 12, cmpLbl: 'Vorjahr', nowLbl: `Jahr ${now.getFullYear()}`,
    fx: x => MN[Math.floor(x)], fxTip: x => x === 0 ? 'Jahresbeginn' : `${MN[Math.min(11, Math.ceil(x) - 1)]}${x % 1 ? ' (laufend)' : ''}`, ticks: () => MN.map((_, i) => i + .5).filter((_, i) => i % 2 === 0), goalDays: 306};
}

function fetchPeriod(p) {
  if (ST.pending[p]) return;
  const sp = periodSpec(p);
  ST.pending[p] = invoke('stats', {ranges: [{from: isoL(sp.cur[0]), to: isoL(sp.cur[1])}, {from: isoL(sp.prev[0]), to: isoL(sp.prev[1])}], detail: true})
    .then(([a, b]) => { ST.cache[p] = buildPeriod(p, sp, a, b); })
    .catch(e => { ST.cache[p] = {...emptyPeriod(p, sp), error: String(e)}; })
    .finally(() => { delete ST.pending[p]; if (S.view === 'dashboard' && !Dash.editing && Dash.period === p) renderWidgets(false); });
}
function fetch28() {
  if (ST.d28p) return;
  const end = addDays(new Date(), 1), start = addDays(end, -29);
  ST.d28p = invoke('stats', {ranges: [{from: isoL(start), to: isoL(end)}], detail: true})
    .then(([a]) => { ST.d28 = a; }).catch(() => { ST.d28 = {rows: [], items: []}; })
    .finally(() => { ST.d28p = null; refreshDashboard(['sales.heatmap', 'stock.low']); });

/* Kumulierte Reihe aus Belegzeilen, gebündelt in Schritte */
function cumPoints(rows, xOf, base, from, to, step) {
  const pts = [{x: from, y: 0}]; let acc = 0, i = 0;
  const sorted = rows.map(r => ({x: xOf(r[0], base), v: r[1] / 100})).sort((a, b) => a.x - b.x);
  const pre = sorted.filter(r => r.x < from).reduce((s, r) => s + r.v, 0); acc = pre; pts[0].y = acc;
  while (i < sorted.length && sorted[i].x < from) i++;
  for (let x = from + step; x < to + 1e-9; x += step) {
    while (i < sorted.length && sorted[i].x <= x) acc += sorted[i++].v;
    pts.push({x: Math.min(x, to), y: acc});
  }
  if (pts[pts.length - 1].x < to - 1e-9) { while (i < sorted.length && sorted[i].x <= to) acc += sorted[i++].v; pts.push({x: to, y: acc}); }
  return pts;
}
const countUntil = (rows, xOf, base, x) => rows.filter(r => xOf(r[0], base) <= x);
function sums(rows) {
  let sale = 0, ret = 0, n = 0, storno = 0;
  rows.forEach(([, t, k]) => { if (k === 'verkauf') { sale += t; n++; } else { ret += -t; if (k === 'storno') storno++; } });
  return {sale: sale / 100, ret: ret / 100, bons: n - storno, rev: (sale - ret) / 100};
}
function emptyPeriod(p, sp) {
  return {p, F: 1, real: true, loading: false, xMin: sp.xMin ?? 8, xMax: sp.xMax === 24 ? 20 : sp.xMax, xTicks: sp.ticks(sp.xMin ?? 8, sp.xMax === 24 ? 20 : sp.xMax), fx: sp.fx, fxTip: sp.fxTip,
    actual: [{x: sp.xMin ?? 8, y: 0}, {x: Math.max(sp.xMin ?? 8, sp.nowX), y: 0}], fc: [], prev: [{x: sp.xMin ?? 8, y: 0}], rev: 0, prevRev: 0, end: 0,
    goal: (+CFG['ziel.tag'] || 2500) * sp.goalDays, since: 'bis jetzt', cmpLbl: sp.cmpLbl, nowLbl: sp.nowLbl, basket: 0, prevBasket: 0, ret: 0, prevRet: 0, bons: 0, prevBons: 0,
    top: [], cats: [], sparks: {rev: [0], bons: [0], basket: [0], ret: [0]}, sollFrac: .5};
}
function buildPeriod(p, sp, a, b) {
  const base = sp.cur[0], pbase = sp.prev[0], nowX = sp.nowX;
  let xMin = sp.xMin, xMax = sp.xMax;
  if (p === 'heute') {
    // Achse = Öffnungszeit, erweitert um tatsächliche Belegzeiten und „jetzt“
    const xs = [...a.rows.map(r => sp.xOf(r[0], base)), ...b.rows.map(r => sp.xOf(r[0], pbase))];
    xMin = Math.max(0, Math.floor(Math.min(8, ...xs))); xMax = Math.min(24, Math.ceil(Math.max(20, nowX, ...xs.map(x => x + .01))));
  }
  const cur = cumPoints(a.rows, sp.xOf, base, xMin, Math.min(xMax, Math.max(xMin, nowX)), sp.step);
  const prev = cumPoints(b.rows, sp.xOf, pbase, xMin, xMax, sp.step);
  const curNow = cur[cur.length - 1].y, prevNow = interpPts(prev, Math.min(nowX, xMax)) ?? 0, prevEnd = prev[prev.length - 1].y;
  const scale = prevNow > 0 ? clamp(curNow / prevNow, .3, 3) : 1;
  const fc = [{x: Math.max(xMin, nowX), y: curNow}];
  if (prevEnd > prevNow && nowX < xMax) prev.filter(q => q.x > nowX).forEach(q => fc.push({x: q.x, y: curNow + (q.y - prevNow) * scale}));
  const end = fc[fc.length - 1].y;
  const A = sums(a.rows), B = sums(countUntil(b.rows, sp.xOf, pbase, nowX));
  // Sparklines: 12 Abschnitte des bisherigen Zeitraums
  const bins = 12, span = Math.max(.001, Math.min(nowX, xMax) - xMin);
  const sp12 = key => { const v = Array(bins).fill(0), c = Array(bins).fill(0); a.rows.forEach(r => { const i = clamp(Math.floor((sp.xOf(r[0], base) - xMin) / span * bins), 0, bins - 1); if (key === 'rev') v[i] += r[1] / 100; else if (r[2] === 'verkauf') { v[i] += r[1] / 100; c[i]++; } }); return key === 'bons' ? c : key === 'basket' ? v.map((x, i) => c[i] ? x / c[i] : 0) : v; };
  const top = (a.items || []).filter(i => i.qty > 0 || i.rev > 0).map(i => {
    const art = artById(i.sku) || {name: i.name, g: 'shirt', colors: [COLOR_KEYS[0]]};
    return {a: {...art, name: art.name || i.name}, units: i.qty, rev: i.rev / 100};
  });
  const totalCat = (a.cats || []).reduce((s, c) => s + Math.max(0, c.rev), 0) || 1;
  return {p, F: 1, real: true, xMin, xMax, xTicks: sp.ticks(xMin, xMax), fx: sp.fx, fxTip: sp.fxTip, actual: cur, fc, prev,
    rev: A.rev, prevRev: B.rev, end, goal: (+CFG['ziel.tag'] || 2500) * sp.goalDays, since: 'bis jetzt', cmpLbl: sp.cmpLbl, nowLbl: sp.nowLbl,
    bons: A.bons, prevBons: B.bons, basket: A.bons ? (A.sale - (a.rows.filter(r => r[2] === 'storno').reduce((s, r) => s - r[1], 0)) / 100) / A.bons : 0,
    prevBasket: B.bons ? B.sale / B.bons : 0, ret: A.sale ? A.ret / A.sale * 100 : 0, prevRet: B.sale ? B.ret / B.sale * 100 : 0,
    top, cats: (a.cats || []).filter(c => c.rev > 0).map(c => ({name: catName(c.cat), v: c.rev / 100, s: c.rev / totalCat})),
    pay: a.pay || [], sold: a.sold, returned: a.returned, sparks: {rev: sp12('rev'), bons: sp12('bons'), basket: sp12('basket')},
    sollFrac: clamp((nowX - xMin) / Math.max(.001, xMax - xMin), 0, 1)};
}
function realPeriodData(p) {

  fetchPeriod(p);

}

    <div class="lock-time" id="lockTime">${clock()}</div>
    <div class="lock-date">${esc(DATE_LONG)} · ${esc(CFG['kasse.name'])} ${esc(CFG['kasse.id'])} ${S.started ? 'gesperrt' : '· Anmeldung'}</div>
    <div class="lock-users">${STAFF.map(u => `<button class="lock-user" data-u="${u.id}" aria-pressed="${u.id === user.id}"><span class="avatar xl" style="--h:${u.hue}">${u.initials}</span>${esc(u.name.split(' ')[0])}</button>`).join('')}</div>
    <div class="lock-card" id="lockCard"></div>
    <div class="lock-foot" id="lockFoot">${DESKTOP ? `<span style="display:inline-flex;gap:6px;align-items:center">${ic('shield', 'i-xs')}PIN-Anmeldung · lokal geprüft</span>` : `<span>Vorschau: jede PIN außer 0000</span>`}</div></div>`;
  document.body.appendChild(el);
  if (DESKTOP) invoke('users_default_pins').then(l => { if (l.length && $('#lockFoot', el)) $('#lockFoot', el).insertAdjacentHTML('beforeend', `<span>·</span><span style="color:var(--warn)">Erst-PIN noch aktiv: ${esc(l.join(' · '))} – bitte unter Einstellungen → Benutzer ändern</span>`); }).catch(() => {});
  const card = $('#lockCard', el);
  const renderCard = msg => {
    card.innerHTML = `<div style="text-align:center;font-size:13px;color:var(--text-2)">PIN für <b style="color:var(--text)">${esc(user.name)}</b> · ${esc(user.role)}</div>
      <div class="pin-dots" id="lockDots" style="margin:14px 0 ${msg ? 6 : 16}px"><i></i><i></i><i></i><i></i></div>
      ${msg ? `<div style="text-align:center;font-size:12.5px;color:var(--neg);margin-bottom:10px">${esc(msg)}</div>` : ''}
      ${pinPad()}
      ${DESKTOP ? '<div class="or" style="margin-top:14px">Windows Hello, Sicherheitsschlüssel und SSO folgen</div>' : `<div class="or">oder anmelden mit</div>
      <div class="auth-alt"><button class="btn btn-secondary" data-m="hello">${ic('faceid')}Windows Hello</button><button class="btn btn-secondary" data-m="fido">${ic('usbkey')}Sicherheitsschlüssel</button><button class="btn btn-secondary" data-m="nfc">${ic('idcard')}Mitarbeiterkarte</button><button class="btn btn-secondary" data-m="sso">${ic('building')}Entra ID · SSO</button></div>`}`;
  };
  const dots = () => $$('#lockDots i', el).forEach((d, i) => d.classList.toggle('on', i < pin.length));
  const unlock = method => {
    busy = true; S.user = user; S.locked = false; S.started = true;
    Hooks.emit('auth.login', {benutzer: user.name, rolle: user.role, methode: method, kasse: CFG['kasse.id']});
    el.classList.add('closing'); setTimeout(() => el.remove(), 320);
    renderMe(); renderTopbar(); if (S.view === 'dashboard') renderDashboard();
    toast(`Willkommen, ${user.name.split(' ')[0]}`, {t2: `Angemeldet per ${method} · ${user.role}`, type: 'pos', icon: 'user'});
    setTimeout(() => S.view === 'kasse' && $('#posSearch')?.focus(), 340);
  };
  const waitFor = async (icon, msg, method) => {
    if (busy) return; busy = true;
    card.innerHTML = `<div class="authwait" style="padding:26px 0"><div class="ring">${ic(icon)}</div><p>${esc(msg)}</p></div>`;
    await wait(reduced() ? 200 : 1300); unlock(method);
  };
  const key = async k => {
    if (busy) return;
    if (k === 'back') pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
    dots();
    if (pin.length === 4) {
      busy = true;
      try { await checkPin(user, pin, 'anmeldung'); setTimeout(() => unlock('PIN'), 120); }
      catch (e) { busy = false; pin = ''; renderCard(e.message); shakeEl($('#lockDots', el)); Hooks.emit('auth.login.failed', {benutzer: user.name, methode: 'PIN'}); }
    }
  };
  el.addEventListener('click', e => {
    const u = e.target.closest('[data-u]'); if (u && !busy) { user = STAFF.find(s => s.id === u.dataset.u); pin = ''; $$('.lock-user', el).forEach(b => b.setAttribute('aria-pressed', b === u)); renderCard(); return; }
    const k = e.target.closest('[data-k]'); if (k) return key(k.dataset.k);
    const m = e.target.closest('[data-m]'); if (!m) return;
    ({hello: () => waitFor('faceid', 'Windows Hello · Gesicht wird erkannt …', 'Windows Hello'), fido: () => waitFor('usbkey', 'Sicherheitsschlüssel einstecken und berühren …', 'FIDO2'),
      nfc: () => waitFor('idcard', 'Mitarbeiterkarte an den Leser halten …', 'NFC-Karte'), sso: () => waitFor('building', 'Weiterleitung an Ihren Identitätsanbieter (OIDC) …', 'Entra ID')})[m.dataset.m]();
  });
  S.lockKey = e => { if (/^\d$/.test(e.key)) { key(e.key); e.preventDefault(); } else if (e.key === 'Backspace') { key('back'); e.preventDefault(); } };
  renderCard();
  Hooks.emit('pos.locked', {kasse: CFG['kasse.id'], benutzer: S.user.name});
}

/* ── Freigabe (Step-up) ── */
function stepUp({title, text, rule, admin = false}) {
  return new Promise((resolve, reject) => {
    const approvers = STAFF.filter(u => admin ? u.roleKey === 'admin' : canApprove(u));
    if (!approvers.length) { toast('Keine berechtigte Person', {t2: admin ? 'Es ist kein Administrator angelegt' : 'Es ist keine Filialleitung angelegt', type: 'warn'}); return reject(new Error('keine Berechtigten')); }
    let done = false, pin = '', busy = false, ap = canApprove(S.user) && (!admin || S.user.roleKey === 'admin') ? S.user : approvers[0];
    const el = openLayer(`<div class="modal" style="width:min(440px,100%)" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div id="suBox"></div></div>`, {onClose: () => { if (!done) reject(new Error('abgebrochen')); }});
    const box = $('#suBox', el);
    const render = msg => {
      box.innerHTML = `<div class="m-head"><div class="m-ic" style="color:var(--warn)">${ic('shield')}</div><div><h2>${esc(title)}</h2><p>${esc(text)}</p></div></div>
      <div class="m-body" id="suBody">
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">${approvers.map(u => `<button class="chip" data-ap="${u.id}" aria-pressed="${u.id === ap.id}" style="height:34px"><span class="avatar" style="--h:${u.hue};width:22px;height:22px;font-size:9.5px">${u.initials}</span>${esc(u.name)} · ${esc(u.role)}</button>`).join('')}</div>
        <div class="pin-dots" id="suDots" aria-label="PIN-Eingabe"><i></i><i></i><i></i><i></i></div>
        ${msg ? `<div style="text-align:center;font-size:12.5px;color:var(--neg);margin:-4px 0 10px">${esc(msg)}</div>` : ''}
        ${pinPad().replace('<span></span>', '<button class="fn" data-close>Abbr.</button>')}
        ${rule ? `<div class="prompt-hint" style="margin-top:14px">${ic('flow', 'i-xs')}${esc(rule)}</div>` : ''}
      </div>`;
    };
    const dots = () => $$('#suDots i', el).forEach((d, i) => d.classList.toggle('on', i < pin.length));
    const ok = async () => {
      done = true;
      box.innerHTML = `<div class="m-body"><div class="authwait"><div class="ok-ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div><p><b style="color:var(--text)">Freigegeben</b> von ${esc(ap.name)} · PIN</p></div></div>`;
      Hooks.emit('auth.stepup.granted', {von: ap.name, methode: 'PIN', regel: rule || null});
      await wait(reduced() ? 100 : 650); closeLayer(el); resolve({by: ap, method: 'PIN'});
    };
    const key = async k => {
      if (busy || done) return;
      if (k === 'back') pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
      dots();
      if (pin.length === 4) {
        busy = true;
        try { await checkPin(ap, pin, 'freigabe'); ok(); }
        catch (e) { busy = false; pin = ''; render(e.message); shakeEl($('#suDots', el)); Hooks.emit('auth.stepup.failed', {von: ap.name, methode: 'PIN'}); }
      }
    };
    el.addEventListener('click', e => { const a = e.target.closest('[data-ap]'); if (a && !busy) { ap = approvers.find(u => u.id === a.dataset.ap); pin = ''; render(); return; } const b = e.target.closest('[data-k]'); if (b) key(b.dataset.k); });
    el.addEventListener('keydown', e => { if (done) return; if (/^\d$/.test(e.key)) { key(e.key); e.preventDefault(); } else if (e.key === 'Backspace') { key('back'); e.preventDefault(); } });
    render();
  });
}

/* ── Einstellungen → Benutzer ── */
function usersSectionHTML() {
  return `<section class="set-sec" id="sec-benutzer"><h2>Benutzer & Anmeldung</h2><p>Jede Person meldet sich mit eigener PIN an. Freigaben (Rabatte, Stornos, Entnahmen, Punkte) erteilen nur Filialleitung und Administrator. Nach 5 Fehlversuchen ist die PIN 2 Minuten gesperrt.</p>
    <div class="card" id="usrBox"></div></section>`;
}
function renderUsersBox() {
  const box = $('#usrBox'); if (!box) return;
  box.innerHTML = STAFF.map(u => `<div class="set-row"><div style="display:flex;align-items:center;gap:12px"><span class="avatar" style="--h:${u.hue}">${u.initials}</span><div><div class="set-l">${esc(u.name)}${u.id === S.user.id ? ' <span class="pill accent" style="height:18px">angemeldet</span>' : ''}</div><div class="set-h">${esc(u.role)} · Kennung ${esc(u.id)}</div></div></div>
      <div class="set-c" style="gap:6px"><button class="btn btn-secondary btn-sm" data-usr="${u.id}">${ic('sliders', 'i-sm')}Bearbeiten</button></div></div>`).join('')
    + `<div class="set-row"><div><div class="set-l">Neue Person</div><div class="set-h">${DESKTOP ? 'Name, Rolle und Erst-PIN festlegen' : 'In der Vorschau nicht verfügbar'}</div></div><div class="set-c"><button class="btn btn-primary btn-sm" data-usr="" ${DESKTOP ? '' : 'disabled'}>${ic('user-plus', 'i-sm')}Benutzer anlegen</button></div></div>`;
}
async function openUserEditor(u) {
  if (!DESKTOP) return toast('Nur in der Desktop-App', {type: 'warn'});
  let by; try { by = (await stepUp({title: 'Administrator-Freigabe', text: u ? `${u.name} bearbeiten` : 'Neue Person anlegen', admin: true})).by; } catch { return; }
  const st = {name: u?.name || '', role: u?.roleKey || 'kasse', pin: '', pin2: ''};
  const el = openLayer(`<div class="modal" style="width:min(480px,100%)" role="dialog" aria-modal="true" aria-label="Benutzer"><div id="ueBody"></div></div>`, {focus: '[data-uf="name"]'});
  const box = $('#ueBody', el);
  const render = () => {
    box.innerHTML = `<div class="m-head"><div class="m-ic">${ic('user')}</div><div><h2>${u ? esc(u.name) : 'Neue Person'}</h2><p>${u ? 'PIN leer lassen, um sie nicht zu ändern' : 'Die PIN gibt die Person beim ersten Mal selbst ein'}</p></div><button class="btn btn-ghost btn-icon x" data-close aria-label="Schließen">${ic('x')}</button></div>
      <div class="m-body" style="display:grid;gap:14px">
        <label class="field"><span>Name</span><input class="input" data-uf="name" value="${esc(st.name)}" autocomplete="off"></label>
        <div><div class="field"><span>Rolle</span></div><div class="reasons" style="margin-top:6px">${Object.entries(ROLE_NAMES).map(([k, l]) => `<button class="chip" data-role="${k}" aria-pressed="${k === st.role}">${l}</button>`).join('')}</div>
          <div class="prompt-hint">${ic('info', 'i-xs')}Kasse/Verkauf: verkaufen, retournieren bis zur Grenze · Filialleitung: Freigaben, Abschluss · Administrator: zusätzlich Benutzer, RKSV, Wiederherstellung</div></div>
        <div class="ed-grid"><label class="field"><span>${u ? 'Neue PIN (4 Ziffern)' : 'PIN (4 Ziffern)'}</span><input class="input num" data-uf="pin" type="password" inputmode="numeric" maxlength="4" value="${esc(st.pin)}" autocomplete="new-password"></label>
          <label class="field"><span>PIN wiederholen</span><input class="input num" data-uf="pin2" type="password" inputmode="numeric" maxlength="4" value="${esc(st.pin2)}" autocomplete="new-password"></label></div>
      </div>
      <div class="m-foot">${u ? `<button class="btn btn-danger" id="ueDel">${ic('trash', 'i-sm')}Deaktivieren</button>` : ''}<span class="sp"></span><button class="btn btn-secondary" data-close>Abbrechen</button><button class="btn btn-primary" id="ueSave">${ic('check', 'i-sm')}Speichern</button></div>`;
  };
  const collect = () => $$('[data-uf]', el).forEach(i => { st[i.dataset.uf] = i.value.trim(); });
  el.addEventListener('click', async e => {
    const r = e.target.closest('[data-role]'); if (r) { collect(); st.role = r.dataset.role; return render(); }
    if (e.target.closest('#ueDel')) {
      if (u.id === S.user.id) return toast('Eigenes Konto kann nicht deaktiviert werden', {type: 'warn'});
      try { setUsers(await invoke('user_delete', {id: u.id, by: by.name})); } catch (err) { return toast('Nicht möglich', {t2: String(err), type: 'warn'}); }
      closeLayer(el); renderUsersBox(); renderMe(); toast('Benutzer deaktiviert', {t2: u.name, icon: 'trash'}); return;
    }
    if (e.target.closest('#ueSave')) {
      collect();
      if (st.name.length < 2) return toast('Name fehlt', {type: 'warn'});
      if ((st.pin || !u) && !/^\d{4}$/.test(st.pin)) return toast('PIN: genau 4 Ziffern', {type: 'warn'});
      if (st.pin !== st.pin2) return toast('PINs stimmen nicht überein', {type: 'warn'});
      try { setUsers(await invoke('user_save', {user: {id: u?.id || '', name: st.name, role: st.role, active: true}, pin: st.pin || null, by: by.name})); }
      catch (err) { return toast('Speichern fehlgeschlagen', {t2: String(err), type: 'warn'}); }
      closeLayer(el); renderUsersBox(); renderMe();
      toast(u ? 'Benutzer gespeichert' : 'Benutzer angelegt', {t2: `${st.name} · ${ROLE_NAMES[st.role]}${st.pin ? ' · neue PIN aktiv' : ''}`, type: 'pos', icon: 'user'});
    }
  });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); $('#ueSave', el).click(); } });
  render();
}

const c2e = c => (c || 0) / 100;
const MOVE_LBL = {anfang: 'Wechselgeld / Übertrag', einlage: 'Einlage', entnahme: 'Entnahme'};
const DENOMS = [500, 200, 100, 50, 20, 10, 5, 2, 1, .5, .2, .1, .05, .02, .01];
function desktopOnly(what) { if (DESKTOP) return false; toast(`${what} nur in der Desktop-App`, {t2: 'Braucht die lokale Datenbank', type: 'warn', icon: 'database'}); return true; }

function reportBodyHTML(s, {closing} = {}) {
  const row = (l, v, cls = '') => `<div class="trow ${cls}"><span>${l}</span><b class="num">${v}</b></div>`;
  return `<div class="zr">
    <div class="zr-sec"><div class="eyebrow">Zeitraum</div>${row('seit', s.from ? esc(fmtTs(s.from)) : 'Beginn der Aufzeichnung')}${row('Belege', s.first ? `${esc(s.first)} – ${esc(s.last)}` : 'keine')}</div>
    <div class="zr-sec"><div class="eyebrow">Umsatz</div>${row(`Verkäufe (${num(s.counts.sales)})`, eur(c2e(s.gross_sales)))}${row(`Retouren & Stornos (${num(s.counts.returns + s.counts.stornos)})`, '− ' + eur(c2e(s.refunds)))}${row('darin Rabatte', eur(c2e(s.discounts)), 'disc')}${row('Gutscheine verkauft (0 %)', eur(c2e(s.vouchers_sold)))}<div class="tgrand" style="margin-top:6px"><span class="lbl">Umsatz</span><span class="val num" style="font-size:22px">${eur(c2e(s.revenue))}</span></div></div>
    <div class="zr-sec"><div class="eyebrow">Steuern</div>${s.vat.length ? s.vat.map(v => row(`${v.rate} % · netto ${eur(c2e(v.net))}`, `${eur(c2e(v.tax))} von ${eur(c2e(v.gross))}`)).join('') : '<div class="muted" style="font-size:12.5px">keine</div>'}</div>
    <div class="zr-sec"><div class="eyebrow">Zahlungsarten</div>${s.payments.length ? s.payments.map(p => row(`${esc(p.label || p.m)} (${p.count})`, eur(c2e(p.amount)))).join('') : '<div class="muted" style="font-size:12.5px">keine</div>'}</div>
    <div class="zr-sec"><div class="eyebrow">Bargeld</div>${row('Wechselgeld / Übertrag', eur(c2e(s.cash.start)))}${row('Bareinnahmen (netto)', eur(c2e(s.cash.sales)))}${row('Einlagen', eur(c2e(s.cash.deposits)))}${row('Entnahmen', '− ' + eur(c2e(s.cash.withdrawals)))}
      <div class="trow" style="font-weight:650;color:var(--text)"><span>Soll-Bestand Lade</span><b class="num">${eur(c2e(s.cash.expected))}</b></div>
      ${closing ? `${row('gezählt', eur(c2e(s.counted)))}<div class="trow" style="font-weight:650;color:${s.diff === 0 ? 'var(--pos)' : 'var(--neg)'}"><span>Differenz</span><b class="num">${s.diff > 0 ? '+' : ''}${eur(c2e(s.diff))}</b></div>` : ''}</div>
    <div class="zr-sec"><div class="eyebrow">Kassier:innen</div>${s.cashiers.length ? s.cashiers.map(c => row(`${esc(c.name || '–')} (${c.sales})`, eur(c2e(c.revenue)))).join('') : '<div class="muted" style="font-size:12.5px">keine</div>'}</div>
  </div>`;
}

  const el = openLayer(`<div class="modal" style="width:min(640px,100%);max-height:calc(100dvh - 48px);display:flex;flex-direction:column" role="dialog" aria-modal="true" aria-label="Kassenbuch"><div id="cbBody" style="display:flex;flex-direction:column;min-height:0"></div></div>`, {focus: '#cbAmt'});
  const box = $('#cbBody', el);
  const render = () => {
    box.innerHTML = `<div class="m-head"><div class="m-ic">${ic('cash')}</div><div><h2>Kassenbuch</h2><p>Soll-Bestand Lade: <b style="color:var(--text)">${eur(c2e(s.cash.expected))}</b> · seit ${s.from ? esc(fmtTs(s.from)) : 'Beginn'}</p></div><button class="btn btn-ghost btn-icon x" data-close aria-label="Schließen">${ic('x')}</button></div>
      <div class="m-body" style="display:grid;gap:14px;overflow:auto">
        <div class="seg" id="cbSeg" style="justify-self:start">${['einlage', 'entnahme', 'anfang'].map(k => `<button data-v="${k}" aria-pressed="${st.kind === k}">${MOVE_LBL[k]}</button>`).join('')}</div>
        <div class="amt-field"><label for="cbAmt">Betrag</label><div class="amt-input"><span>€</span><input id="cbAmt" inputmode="decimal" value="${esc(st.amt)}" placeholder="0,00" autocomplete="off"></div></div>
        <div><div class="field"><span>Grund</span></div><div class="reasons" style="margin-top:6px">${REASONS[st.kind].map(r => `<button class="chip" data-r="${esc(r)}" aria-pressed="${r === st.reason}">${esc(r)}</button>`).join('')}</div></div>
        ${st.kind === 'entnahme' ? `<div class="rule-box">${ic('shield')}<div>Entnahmen erfordern eine Freigabe durch die Filialleitung.</div></div>` : ''}
        <div><div class="eyebrow" style="margin-bottom:6px">Buchungen seit dem letzten Abschluss</div><div class="card" style="overflow:hidden">${s.moves.length ? s.moves.slice().reverse().map(m => `<div class="mv"><div><b>${esc(MOVE_LBL[m.kind] || m.kind)}</b> · ${esc(m.reason)}<br><small>${esc(fmtTs(m.ts))}${m.user ? ' · ' + esc(m.user) : ''}</small></div><div><div class="d ${m.amount > 0 ? 'p' : 'm'}">${m.amount > 0 ? '+' : ''}${eur(c2e(m.amount))}</div></div></div>`).join('') : '<div class="empty" style="padding:22px"><p>Noch keine Buchungen.</p></div>'}</div></div>
