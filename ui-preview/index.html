    initSeg($('#cbSeg', box), b => { st.kind = b.dataset.v; st.reason = REASONS[st.kind][0]; render(); $('#cbAmt', box).focus(); });
  };
  st.reason = REASONS.einlage[0];
  const go2 = async () => {
    st.amt = $('#cbAmt', box).value; const v = parseAmt(st.amt);
    if (!(v > 0)) return shakeEl($('#cbAmt', box).closest('.amt-input'));
    let by = null;
    if (st.kind === 'entnahme') { try { by = (await stepUp({title: 'Entnahme freigeben', text: `${eur(v)} · ${st.reason}`})).by.name; } catch { return; } }
    try { s = await invoke('cash_move', {kind: st.kind, amount: Math.round(v * 100), reason: st.reason, user: S.user.name, approvedBy: by}); }
    catch (e) { return toast('Buchung nicht möglich', {t2: String(e), type: 'warn'}); }
    toast(`${MOVE_LBL[st.kind]} gebucht`, {t2: `${eur(v)} · ${st.reason} · Soll-Bestand ${eur(c2e(s.cash.expected))}`, type: 'pos', icon: 'cash'});
    Hooks.emit('cash.moved', {art: st.kind, betrag: v, grund: st.reason});
    openDrawer(MOVE_LBL[st.kind], true);
    st.amt = ''; render();
  };
  box.addEventListener('click', e => { const r = e.target.closest('[data-r]'); if (r) { st.amt = $('#cbAmt', box).value; st.reason = r.dataset.r; render(); } if (e.target.closest('#cbGo')) go2(); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.target.closest('[data-close]')) { e.preventDefault(); go2(); } });
  render();
}

/* ── Tagesabschluss mit Kassensturz ── */
async function openClosing() {
  if (desktopOnly('Tagesabschluss')) return;
  let s, rk = null;
  try { s = await invoke('cash_status'); rk = await invoke('rksv_status'); } catch (e) { return toast('Abschluss nicht möglich', {t2: String(e), type: 'warn'}); }
  const now = new Date(), lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() === now.getDate();
  // Jeder Monat endet mit einem Monatsbeleg: am Monatsende für diesen Monat, sonst (nachträglich) für den Vormonat
  const idx = d => d.getFullYear() * 12 + d.getMonth(), lm = rk?.last_monthly ? new Date(rk.last_monthly) : null;
  const needIdx = lastDay ? idx(now) : idx(now) - 1, needY = Math.floor(needIdx / 12), needM = needIdx % 12;
  const monthMissing = !!rk?.active && needIdx >= idx(new Date(rk.started_at)) && (!lm || idx(lm) < needIdx);
  const st = {count: Object.fromEntries(DENOMS.map(d => [d, ''])), total: '', mode: 'stueck', note: '', monthly: monthMissing};
  const el = openLayer(`<div class="modal" style="width:min(860px,100%);max-height:calc(100dvh - 48px);display:flex;flex-direction:column" role="dialog" aria-modal="true" aria-label="Tagesabschluss"><div id="zBody" style="display:flex;flex-direction:column;min-height:0"></div></div>`, {closeOnScrim: false});
  const box = $('#zBody', el);
  const counted = () => st.mode === 'summe' ? (parseAmt(st.total) || 0) : r2(DENOMS.reduce((a, d) => a + d * (parseInt(st.count[d], 10) || 0), 0));
  const update = () => {
    const c = counted(), diff = r2(c - c2e(s.cash.expected));
    $('#zCounted', box).textContent = eur(c);
    const d = $('#zDiff', box); d.textContent = `${diff > 0 ? '+' : ''}${eur(diff)}`; d.style.color = Math.abs(diff) < .005 ? 'var(--pos)' : 'var(--neg)';
    $('#zNoteReq', box).hidden = Math.abs(diff) < .005;
  };
  const render = () => {
    box.innerHTML = `<div class="m-head"><div class="m-ic">${ic('lock')}</div><div><h2>Tagesabschluss · Z-Bericht</h2><p>Kassensturz zählen, Differenz prüfen, Zeitraum festschreiben</p></div><button class="btn btn-ghost btn-icon x" data-close aria-label="Schließen">${ic('x')}</button></div>
      <div class="m-body" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;overflow:auto">
        <div>${reportBodyHTML(s)}</div>
        <div style="display:grid;gap:12px;align-content:start">
          <div class="seg" id="zSeg" style="justify-self:start"><button data-v="stueck" aria-pressed="${st.mode === 'stueck'}">Stückelung zählen</button><button data-v="summe" aria-pressed="${st.mode === 'summe'}">Summe eingeben</button></div>
          ${st.mode === 'stueck' ? `<div class="denoms">${DENOMS.map(d => `<label><span>${d >= 1 ? num(d) + ' €' : num(d * 100) + ' ct'}</span><input class="input num" data-den="${d}" inputmode="numeric" value="${esc(st.count[d])}" placeholder="0"></label>`).join('')}</div>`
            : `<div class="amt-field"><label for="zTotal">Gezählter Bargeldbestand</label><div class="amt-input"><span>€</span><input id="zTotal" inputmode="decimal" value="${esc(st.total)}" placeholder="0,00"></div></div>`}
          <div class="preview-box"><span>Gezählt<br><span class="muted" style="font-size:12px">Soll ${eur(c2e(s.cash.expected))}</span></span><b class="num" id="zCounted"></b></div>
          <div class="preview-box"><span>Differenz</span><b class="num" id="zDiff"></b></div>
          <label class="field"><span>Notiz <span id="zNoteReq" class="muted">· bei Differenz bitte begründen</span></span><input class="input" id="zNote" value="${esc(st.note)}" placeholder="z. B. Wechselgeld falsch herausgegeben"></label>
          ${rk?.active ? `<div class="set-row" style="padding:10px 12px;border:1px solid var(--line);border-radius:12px"><div><div class="set-l">RKSV-Monatsbeleg erstellen</div><div class="set-h">${monthMissing ? `<span style="color:var(--warn)">fällig für ${pad(needM + 1)}/${needY}</span>` : 'nicht fällig'}${monthMissing && needM === 11 ? ' · gilt als Jahresbeleg (prüfen und aufbewahren)' : ''}</div></div><div class="set-c" style="min-width:0"><button class="switch" role="switch" id="zMonthly" aria-checked="${st.monthly}" aria-label="Monatsbeleg"></button></div></div>` : ''}
          <div class="prompt-hint">${ic('info', 'i-xs')}Der gezählte Betrag bleibt als Wechselgeld in der Lade (Übertrag). Geld für die Bank vorher im Kassenbuch als Entnahme buchen.</div>
        </div>
      </div>
      <div class="m-foot"><button class="btn btn-ghost" id="zBook">${ic('cash', 'i-sm')}Kassenbuch</button><span class="sp"></span><button class="btn btn-secondary" data-close>Abbrechen</button><button class="btn btn-primary" id="zGo">${ic('lock', 'i-sm')}Abschluss durchführen</button></div>`;
    initSeg($('#zSeg', box), b => { st.mode = b.dataset.v; render(); });
    update();
  };
  box.addEventListener('input', e => {
    if (e.target.dataset.den) { st.count[e.target.dataset.den] = e.target.value.replace(/\D/g, ''); e.target.value = st.count[e.target.dataset.den]; }
    if (e.target.id === 'zTotal') st.total = e.target.value;
    if (e.target.id === 'zNote') st.note = e.target.value;
    update();
  });
  box.addEventListener('click', async e => {
    if (e.target.closest('#zMonthly')) { st.monthly = !st.monthly; e.target.closest('#zMonthly').setAttribute('aria-checked', st.monthly); return; }
    if (e.target.closest('#zBook')) { closeLayer(el); return openCashBook(); }
    if (!e.target.closest('#zGo')) return;
    const c = counted(), diff = r2(c - c2e(s.cash.expected));
    if (Math.abs(diff) >= .005 && st.note.trim().length < 3) { shakeEl($('#zNote', box)); return toast('Differenz bitte begründen', {type: 'warn', icon: 'alert'}); }
    if (Math.abs(diff) >= .005) { try { await stepUp({title: 'Kassendifferenz freigeben', text: `Differenz ${eur(diff)} · ${st.note}`}); } catch { return; } }
    let z;
    try { z = await invoke('closing_create', {counted: Math.round(c * 100), note: st.note.trim(), user: S.user.name}); }
    catch (err) { return toast('Abschluss fehlgeschlagen', {t2: String(err), type: 'warn', dur: 8000}); }
    let mb = null;
    if (st.monthly) { try { mb = await invoke('rksv_null', {label: `${needM === 11 ? 'Jahresbeleg' : 'Monatsbeleg'} ${needY}-${pad(needM + 1)}`, user: S.user.name}); } catch (err) { toast('Monatsbeleg fehlgeschlagen', {t2: String(err), type: 'warn'}); } }
    Hooks.emit('cash.closing', {nr: z.no, umsatz: c2e(z.revenue), differenz: c2e(z.diff)});
    statsInvalidate();
    showZ(el, box, z, mb);
  });
  render();
}
function showZ(el, box, z, mb, viewOnly) {
  box.innerHTML = `<div class="m-head"><div class="m-ic" style="color:var(--pos)">${ic('check')}</div><div><h2>Abschluss Nr. ${z.no} durchgeführt</h2><p>${esc(fmtTs(z.ts))} · ${esc(z.user || '')}${mb ? ` · ${esc(mb.data.label)} ${esc(mb.no)} signiert` : ''}</p></div><button class="btn btn-ghost btn-icon x" data-close aria-label="Schließen">${ic('x')}</button></div>
    <div class="m-body" style="overflow:auto">${reportBodyHTML(z, {closing: true})}</div>
    <div class="m-foot"><button class="btn btn-secondary" id="zPrint">${ic('printer', 'i-sm')}Z-Bericht drucken</button><span class="sp"></span><button class="btn btn-primary" data-close>Fertig</button></div>`;
  $('#zPrint', box).onclick = () => printOps(reportOps(z, `Z-BERICHT NR. ${z.no}`), 'z-bericht');

}

/* ════════════════════════════════════════════════════════════════════
   23 · RKSV — Testmodus, Null-/Monatsbelege, DEP-Export, QR-Codes

async function refreshRksv() {
  if (!DESKTOP) return null;
  try { S.rksv = await invoke('rksv_status'); } catch { S.rksv = null; }
  renderStatus(); return S.rksv;
}
// Echte QR-Codes: jedes Element mit data-qr wird per Rust-Encoder (SVG) befüllt.
const QR_CACHE = new Map();
async function hydrateQR(root = document) {
  if (!DESKTOP) return;
  for (const el of $$('[data-qr]:not([data-qr-done])', root)) {
    el.setAttribute('data-qr-done', '1');
    const t = el.dataset.qr;
    try { if (!QR_CACHE.has(t)) QR_CACHE.set(t, await invoke('qr_svg', {text: t})); el.innerHTML = QR_CACHE.get(t); }
    catch (e) { el.textContent = 'QR nicht verfügbar'; }
  }
}
new MutationObserver(() => { if ($('[data-qr]:not([data-qr-done])')) hydrateQR(); }).observe(document.body, {childList: true, subtree: true});

function rksvBlockHTML(rec) {
  if (rec.rksv?.qr) return `<div class="qrw" data-qr="${esc(rec.rksv.qr)}"></div><div class="sm c">RKSV · TESTMODUS (nicht registriert)<br>Kasse ${esc(rec.rksv.qr.split('_')[2] || '')} · Zert. ${esc(rec.rksv.qr.split('_')[11] || '')}</div>`;
  if (DESKTOP) return `<div class="sm c" style="margin-top:6px">Ohne RKSV-Signatur – Testbetrieb unter Einstellungen → RKSV starten</div>`;
  return `<div class="qrw">${pseudoQR('rksv|' + rec.no + '|' + rec.sig)}</div><div class="sm c">RKSV · Signatur ES256 · Zert. 3D1F8A20<br>Sig. …${(rec.sig || '').slice(-12)}${rec.offline ? '<br>Offline erfasst · Sync ausstehend' : ''}</div>`;
}
function zeroReceiptHTML(rec, tpl) {
  const dt = rec.date, d = `${pad(dt.getDate())}.${pad(dt.getMonth() + 1)}.${dt.getFullYear()} ${pad(dt.getHours())}:${pad(dt.getMinutes())}:${pad(dt.getSeconds())}`;

function rksvSectionHTML() {

    <div class="card" id="rksvBox"><div style="padding:18px" class="thinking"><b>Lade …</b></div></div></section>`;

    + row('DEP-Export', 'Datenerfassungsprotokoll als JSON (z. B. für die Finanzprüfung)', `<button class="btn btn-secondary btn-sm" id="rkDep">${ic('download', 'i-sm')}Exportieren …</button>`);

async function rksvStart() {

async function rksvNull(kind) {

function showZeroReceipt(r, title) {

/* ════════════════════════════════════════════════════════════════════
   24 · BONDRUCKER & KASSENLADE (ESC/POS)
   Netzwerkdrucker (IP, Port 9100) oder installierter Windows-Drucker.
   Die Kassenlade hängt am Drucker und öffnet über dessen Impuls.
   ════════════════════════════════════════════════════════════════════ */
const printerOn = () => DESKTOP && CFG['drucker.art'] && CFG['drucker.art'] !== 'aus';
const m2 = v => num(v, 2);
async function printOps(ops, purpose, quiet) {
  if (!DESKTOP) { if (!quiet) toast('Gedruckt (Vorschau)', {t2: 'In der Desktop-App an den Bondrucker', icon: 'printer'}); return true; }
  if (!printerOn()) { if (!quiet) toast('Kein Bondrucker eingerichtet', {t2: 'Einstellungen → Drucker & Kassenlade', type: 'warn', icon: 'printer', action: {label: 'Einrichten', run: () => { go('einstellungen'); setTimeout(() => $('#sec-drucker')?.scrollIntoView({block: 'start'}), 150); }}}); return false; }
  try { await invoke('printer_print', {ops, purpose}); if (!quiet) toast('Gedruckt', {t2: purpose, type: 'pos', icon: 'printer', dur: 1800}); return true; }
  catch (e) { toast('Druck fehlgeschlagen', {t2: String(e), type: 'warn', icon: 'printer', dur: 7000}); return false; }
}
async function openDrawer(reason, auto) {
  Hooks.emit('device.drawer.opened', {kasse: CFG['kasse.id'], benutzer: S.user.name, grund: reason});
  if (!DESKTOP) return toast('Kassenlade geöffnet', {t2: 'Vorschau', icon: 'cash'});
  if (!printerOn() || !CFG['drucker.lade']) { if (!auto) toast('Keine Kassenlade eingerichtet', {t2: 'Einstellungen → Drucker & Kassenlade', type: 'warn', icon: 'cash'}); return; }
  try { await invoke('printer_print', {ops: [{t: 'drawer'}], purpose: 'lade: ' + reason}); if (!auto) toast('Kassenlade geöffnet', {t2: reason, icon: 'cash', dur: 1600}); }
  catch (e) { toast('Kassenlade nicht erreichbar', {t2: String(e), type: 'warn', icon: 'cash'}); }
}
function headOps() {
  return [...(CFG['bon.logo'] && CFG['bon.logoDruck'] ? [{t: 'logo'}] : []), {t: 'text', s: CFG['firma.marke'], a: 'c', b: true, big: true}, {t: 'text', s: CFG['firma.zusatz'], a: 'c'}, {t: 'text', s: `${CFG['firma.adresse']}\nUID ${CFG['firma.uid']} · Tel. ${CFG['firma.telefon']}`, a: 'c'}, ...(CFG['bon.kopf'] ? [{t: 'text', s: CFG['bon.kopf'], a: 'c'}] : []), {t: 'line'}];
}
function receiptOps(rec) {
  const ops = headOps(), dt = rec.date;
  const d = `${pad(dt.getDate())}.${pad(dt.getMonth() + 1)}.${dt.getFullYear()} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
  const kind = rec.kind || 'verkauf';
  if (kind !== 'verkauf') ops.push({t: 'text', s: (rec.label || kindLabel(rec)).toUpperCase(), a: 'c', b: true, big: true}, ...(rec.ref ? [{t: 'text', s: `zu Bon ${rec.ref} · ${rec.reason || ''}`, a: 'c'}] : []));
  if (rec.copy) ops.push({t: 'text', s: '*** KOPIE ***', a: 'c', b: true});
  ops.push({t: 'lr', l: `Bon ${rec.no}`, r: `Kasse ${CFG['kasse.id']}`}, {t: 'lr', l: d, r: (rec.cashier || '').split(' ')[0]}, {t: 'line'});
  const neg = kind === 'retoure' || kind === 'storno';
  (rec.lines || []).forEach(l => {
    const amount = neg ? -(l.refund || 0) / 100 : r2(l.unit * l.qty);
    ops.push({t: 'lr', l: `${neg ? '-' : ''}${l.qty} x ${l.name}`, r: m2(amount)});
    const v = l.service ? (l.meta || '') : `${COLORS[l.c]?.[0] || l.c || ''}${l.s && l.s !== 'Einheitsgröße' ? ' · ' + l.s : ''}`;
    if (v) ops.push({t: 'text', s: '  ' + v});
    if (CFG['bon.artikelnr'] && l.sku) ops.push({t: 'text', s: '  Art.-Nr. ' + l.sku});
    if (!neg && l.disc) ops.push({t: 'lr', l: `  Rabatt ${l.disc.pct} %`, r: '-' + m2(r2(r2(l.unit * l.qty) * l.disc.pct / 100))});
  });
  if (!neg && rec.billDisc) ops.push({t: 'lr', l: `Bonrabatt ${rec.billDisc.pct} %`, r: '-' + m2(r2(rec.t.disc - (rec.lines || []).reduce((s, l) => s + (l.disc ? r2(r2(l.unit * l.qty) * l.disc.pct / 100) : 0), 0)))});
  ops.push({t: 'line'}, {t: 'lr', l: neg ? 'ERSTATTUNG EUR' : 'SUMME EUR', r: m2(rec.t.total), b: true}, {t: 'line'});
  (rec.parts || []).forEach(p => ops.push({t: 'lr', l: p.label + (p.code ? ' ' + p.code : ''), r: m2(p.given || p.amount)}));
  if (rec.change > 0) ops.push({t: 'lr', l: 'Rückgeld', r: m2(rec.change)});
  if (!neg && CFG['bon.ersparnis'] && savingsOf(rec) > 0) ops.push({t: 'lr', l: 'Sie sparen heute', r: m2(savingsOf(rec)), b: true});
  if ((rec.t.vat || []).length || rec.t.zero) {
    ops.push({t: 'line'}, {t: 'lr', l: 'MwSt', r: 'Netto  Steuer  Brutto'});
    (rec.t.vat || []).forEach(v => ops.push({t: 'lr', l: `${v.rate} %`, r: `${m2(v.net)}  ${m2(v.tax)}  ${m2(v.gross)}`}));
    if (rec.t.zero) ops.push({t: 'lr', l: '0 %', r: `${m2(rec.t.zero)}  0,00  ${m2(rec.t.zero)}`});
  }
  if (rec.customer) ops.push({t: 'line'}, {t: 'text', s: `Kunde ${rec.customer.id}${neg ? '' : ` · +${rec.pointsEarned ?? rec.t.points} Punkte`}`, a: 'c'});

  ops.push({t: 'feed', n: 4}, {t: 'cut'});
  return ops;
}
function reportOps(s, title) {
  const ops = headOps(), e = c => m2((c || 0) / 100);

  s.vat.forEach(v => ops.push({t: 'lr', l: `MwSt ${v.rate} %`, r: `${e(v.net)}  ${e(v.tax)}  ${e(v.gross)}`}));
  ops.push({t: 'line'}); s.payments.forEach(p => ops.push({t: 'lr', l: `${p.label || p.m} (${p.count})`, r: e(p.amount)}));
  ops.push({t: 'line'}, {t: 'lr', l: 'Wechselgeld/Übertrag', r: e(s.cash.start)}, {t: 'lr', l: 'Bareinnahmen', r: e(s.cash.sales)}, {t: 'lr', l: 'Einlagen', r: e(s.cash.deposits)}, {t: 'lr', l: 'Entnahmen', r: '-' + e(s.cash.withdrawals)}, {t: 'lr', l: 'SOLL-BESTAND', r: e(s.cash.expected), b: true});
  if (s.counted != null) ops.push({t: 'lr', l: 'GEZÄHLT', r: e(s.counted), b: true}, {t: 'lr', l: 'DIFFERENZ', r: e(s.diff), b: true}, ...(s.note ? [{t: 'text', s: 'Notiz: ' + s.note}] : []));
  ops.push({t: 'line'}); s.cashiers.forEach(c => ops.push({t: 'lr', l: `${c.name || '-'} (${c.sales})`, r: e(c.revenue)}));
  if (s.rksv_turnover != null) ops.push({t: 'line'}, {t: 'lr', l: 'RKSV Umsatzzähler', r: e(s.rksv_turnover)});
  ops.push({t: 'feed', n: 4}, {t: 'cut'});
  return ops;
}

const RP = {p: 'monat', from: '', to: '', tab: 'tage', data: null, closings: [], vouchers: []};
const dIso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function rpRange() {
  const now = new Date(), sod = new Date(now.getFullYear(), now.getMonth(), now.getDate()), mon = addDays(sod, -((now.getDay() + 6) % 7));

    monat: [new Date(now.getFullYear(), now.getMonth(), 1), new Date(now.getFullYear(), now.getMonth() + 1, 1)],

const rpLabel = () => { const [f, t] = rpRange(); const e = addDays(t, -1); return dIso(f) === dIso(e) ? f.toLocaleDateString('de-AT') : `${f.toLocaleDateString('de-AT')} – ${e.toLocaleDateString('de-AT')}`; };

const TABS = [['tage', 'Tage'], ['gruppen', 'Warengruppen'], ['artikel', 'Artikel'], ['zahlung', 'Zahlungsarten'], ['steuer', 'Steuern'], ['kassier', 'Kassier:innen'], ['abschluesse', 'Tagesabschlüsse'], ['gutscheine', 'Gutscheine']];

async function voucherPay(m, rem) {
  const inp = $('#gsCode'); const code = (inp?.value || '').trim().toUpperCase();
  const term = $('#term');
  if (!code) { shakeEl(inp?.closest('.amt-input')); return; }
  if (PAY.vcheck !== code) {
    let v;
    try { v = await invoke('voucher_get', {code}); }
    catch (e) { term.innerHTML = `<div class="dev" style="color:var(--neg)">${ic('alert')}</div><h3>Gutschein unbekannt</h3><p>${esc(String(e))}</p>`; return; }
    const usedHere = PAY.parts.filter(p => p.code === v.code).reduce((s, p) => s + p.amount, 0);
    const bal = r2(v.balance / 100 - usedHere), use = Math.min(bal, rem);
    if (v.status !== 'aktiv' || v.expired || bal <= 0) {
      term.innerHTML = `<div class="dev" style="color:var(--warn)">${ic('gift')}</div><h3>Nicht einlösbar</h3><p>${esc(v.code)} · ${v.expired ? 'abgelaufen am ' + esc(v.valid_until) : v.status === 'aktiv' ? 'kein Restwert' : esc(v.status)}</p>`; return;
    }
    Object.assign(PAY, {vcheck: code, vcode: v.code, vuse: use, vbal: bal});
    term.innerHTML = `<div class="dev" style="width:auto;height:auto;padding:16px 20px;border-radius:14px;text-align:left;display:block"><div class="eyebrow">Gutschein ${esc(v.code)}</div><div style="font-size:26px;font-weight:650;margin-top:4px">${eur(bal)}</div><div class="muted" style="font-size:12px">Restwert · gültig bis ${esc(v.valid_until ? new Date(v.valid_until).toLocaleDateString('de-AT') : '–')}</div></div><p>Einzulösen: <b style="color:var(--text)">${eur(use)}</b>${bal > use ? ` · Restwert danach ${eur(bal - use)}` : ''}</p>`;
    $('#payGo').innerHTML = `${ic('check', 'i-sm')}${eur(use)} einlösen<span class="kbd">↵</span>`;
    return;
  }
  const {vcode, vuse, vbal} = PAY; PAY.vcheck = null;
  addPart(m, vuse, `${vcode}${vbal > vuse ? ` · Rest ${eur(vbal - vuse)}` : ''}`, {code: vcode});
}

/* ── EAN-13 als SVG ── */
const EAN_L = ['0001101', '0011001', '0010011', '0111101', '0100011', '0110001', '0101111', '0111011', '0110111', '0001011'];
const EAN_G = ['0100111', '0110011', '0011011', '0100001', '0011101', '0111001', '0000101', '0010001', '0001001', '0010111'];
const EAN_R = EAN_L.map(p => [...p].map(b => b === '0' ? '1' : '0').join(''));
const EAN_P = ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLG', 'LGLGGL', 'LGGLGL'];
function ean13SVG(code, h = 30) {
  if (!/^\d{13}$/.test(code)) return `<span style="font:8pt monospace">${esc(code)}</span>`;
  const d = [...code].map(Number), p = EAN_P[d[0]];
  let bits = '101'; for (let i = 1; i <= 6; i++) bits += (p[i - 1] === 'L' ? EAN_L : EAN_G)[d[i]];
  bits += '01010'; for (let i = 7; i <= 12; i++) bits += EAN_R[d[i]]; bits += '101';
  const guard = i => i < 3 || (i >= 45 && i < 50) || i >= 92;
  let rects = ''; [...bits].forEach((b, i) => { if (b === '1') rects += `<rect x="${i + 7}" y="0" width="1" height="${guard(i) ? h + 5 : h}"/>`; });
  return `<svg viewBox="0 0 109 ${h + 12}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%"><g fill="#000">${rects}</g><g font-family="monospace" font-size="9" text-anchor="middle"><text x="3" y="${h + 11}">${d[0]}</text><text x="31" y="${h + 11}">${code.slice(1, 7)}</text><text x="77" y="${h + 11}">${code.slice(7)}</text></g></svg>`;
}

const PROMOS = [];
const today = () => dIso(new Date());
function promoActive(p, d = today()) { return p.active && p.from_date <= d && p.to_date >= d; }
function promoMatches(p, a) {
  if (p.scope === 'alle') return true;
  const v = p.scope_values || [];
  return p.scope === 'warengruppe' ? v.includes(a.cat) : p.scope === 'marke' ? v.includes(a.brand) : v.includes(a.id);
}
/* Bester gültiger Preis: dauerhafter Aktionspreis des Artikels oder laufende Preisaktion. */
function applyPromos() {
  const d = today();
  ART.forEach(a => {
    if (!('baseSale' in a)) a.baseSale = a.sale ?? null;
    let best = a.baseSale || a.price, promo = null;
    PROMOS.filter(p => promoActive(p, d) && promoMatches(p, a)).forEach(p => { const x = r2(a.price * (1 - p.pct / 100)); if (x < best - .001) { best = x; promo = p; } });
    a.sale = best < a.price - .001 ? best : undefined; a.promo = promo ? promo.name : null;
  });
}
async function loadPromos() {
  if (!DESKTOP) return;
  try { const l = await invoke('promotions_list'); PROMOS.length = 0; PROMOS.push(...l); applyPromos(); } catch (e) { console.error(e); }
}
const promoState = p => !p.active ? ['pausiert', ''] : p.to_date < today() ? ['beendet', ''] : p.from_date > today() ? ['geplant', 'info'] : ['läuft', 'pos'];
const scopeText = p => p.scope === 'alle' ? 'gesamtes Sortiment' : p.scope === 'warengruppe' ? p.scope_values.map(catName).join(', ') : p.scope === 'marke' ? p.scope_values.join(', ') : `${p.scope_values.length} Artikel`;

function renderAktionen() {
  const v = $('#view-aktionen');
  const affected = p => ART.filter(a => promoMatches(p, a)).length;
  v.innerHTML = `<div class="cv">
    <div class="cv-head"><div><h2 class="h-title">Preisaktionen</h2><div class="dash-meta" style="margin-top:6px"><span>Prozent-Aktionen mit Zeitraum · die Kasse nimmt automatisch den günstigsten gültigen Preis</span></div></div>
      <button class="btn btn-primary" id="prNew" ${DESKTOP ? '' : 'disabled'}>${ic('plus', 'i-sm')}Neue Aktion</button></div>
    <div class="kpis"><div class="card"><b class="num">${PROMOS.filter(p => promoState(p)[0] === 'läuft').length}</b><span>laufen heute</span></div><div class="card"><b class="num">${PROMOS.filter(p => promoState(p)[0] === 'geplant').length}</b><span>geplant</span></div><div class="card"><b class="num">${ART.filter(a => a.promo).length}</b><span>Artikel derzeit reduziert (Aktion)</span></div></div>
    <div class="card">${PROMOS.length ? `<table class="tbl art-tbl"><thead><tr><th style="padding-left:16px">Aktion</th><th>Status</th><th class="r">Nachlass</th><th>Gilt für</th><th>Zeitraum</th><th class="r">Artikel</th><th></th></tr></thead><tbody>${PROMOS.map(p => { const [t, tone] = promoState(p); return `<tr data-promo="${p.id}"><td style="padding-left:16px"><b>${esc(p.name)}</b></td><td><span class="pill ${tone}" style="height:20px">${t}</span></td><td class="r"><b>−${p.pct} %</b></td><td class="muted">${esc(scopeText(p))}</td><td class="muted">${esc(new Date(p.from_date + 'T12:00').toLocaleDateString('de-AT'))} – ${esc(new Date(p.to_date + 'T12:00').toLocaleDateString('de-AT'))}</td><td class="r num">${affected(p)}</td><td class="r" style="padding-right:14px;color:var(--text-3)">${ic('chevron-right', 'i-sm')}</td></tr>`; }).join('')}</tbody></table>`
      : `<div class="empty" style="padding:56px 20px"><div class="empty-icon">${ic('percent')}</div><h3>${DESKTOP ? 'Noch keine Preisaktionen' : 'Preisaktionen nur in der Desktop-App'}</h3><p>z. B. „Winter-Sale −20 % auf Jacken“ vom 1. bis 15. – Preise an der Kasse ändern sich automatisch.</p></div>`}</div></div>`;
}
function openPromo(p) {
  const st = p ? {...p, scope_values: [...p.scope_values]} : {name: '', pct: 20, scope: 'warengruppe', scope_values: [], from_date: today(), to_date: dIso(addDays(new Date(), 14)), active: true};

    const opts = st.scope === 'warengruppe' ? CATS.filter(c => c.id !== 'alle').map(c => [c.id, c.name]) : st.scope === 'marke' ? brands.map(b => [b, b]) : st.scope === 'artikel' ? ART.filter(a => st.scope_values.includes(a.id) || (q && a.hay.includes(norm(q)))).slice(0, 24).map(a => [a.id, a.name]) : [];
    const pv = preview();
    box.innerHTML = `<div class="m-head"><div class="m-ic">${ic('percent')}</div><div><h2>${p ? esc(p.name) : 'Neue Preisaktion'}</h2><p>${pv.length} Artikel betroffen</p></div><button class="btn btn-ghost btn-icon x" data-close aria-label="Schließen">${ic('x')}</button></div>
      <div class="m-body" style="display:grid;gap:14px;overflow:auto">
        <div class="ed-grid"><label class="field full"><span>Name (erscheint am Bon)</span><input class="input" id="paName" value="${esc(st.name)}" placeholder="z. B. Winter-Sale Jacken"></label>
          <label class="field"><span>Von</span><input class="input" type="date" id="paFrom" value="${st.from_date}"></label><label class="field"><span>Bis (einschließlich)</span><input class="input" type="date" id="paTo" value="${st.to_date}"></label></div>
        <div><div class="field"><span>Nachlass</span></div><div class="opt-grid" style="margin-top:6px;grid-template-columns:repeat(7,1fr)">${[10, 15, 20, 25, 30, 40, 50].map(x => `<button class="opt" data-pct="${x}" aria-pressed="${x === st.pct}">−${x} %</button>`).join('')}</div></div>
        <div><div class="field"><span>Gilt für</span></div><div class="seg" id="paSeg" style="margin-top:6px">${[['alle', 'Alles'], ['warengruppe', 'Warengruppen'], ['marke', 'Marken'], ['artikel', 'Einzelne Artikel']].map(([k, l]) => `<button data-v="${k}" aria-pressed="${st.scope === k}">${l}</button>`).join('')}</div></div>
        ${st.scope === 'artikel' ? `<label class="search-field" style="height:40px">${ic('search')}<input id="paQ" value="${esc(q)}" placeholder="Artikel suchen …" autocomplete="off"></label>` : ''}
        ${opts.length ? `<div class="reasons">${opts.map(([k, l]) => `<button class="chip" data-sv="${esc(k)}" aria-pressed="${st.scope_values.includes(k)}">${esc(l)}</button>`).join('')}</div>` : ''}
        <div class="set-row" style="padding:10px 12px;border:1px solid var(--line);border-radius:12px"><div><div class="set-l">Aktiv</div><div class="set-h">Ausschalten pausiert die Aktion, ohne sie zu löschen</div></div><div class="set-c" style="min-width:0"><button class="switch" role="switch" id="paAct" aria-checked="${st.active}" aria-label="Aktiv"></button></div></div>
        ${pv.length ? `<div class="prompt-hint">${ic('eye', 'i-xs')}Beispiele: ${pv.slice(0, 4).map(a => `${esc(a.name)} ${eur(a.price)} → <b>${eur(Math.min(a.baseSale || a.price, r2(a.price * (1 - st.pct / 100))))}</b>`).join(' · ')}</div>` : ''}
      </div>
      <div class="m-foot">${p ? `<button class="btn btn-danger" id="paDel">${ic('trash', 'i-sm')}Löschen</button>` : ''}<span class="sp"></span><button class="btn btn-secondary" data-close>Abbrechen</button><button class="btn btn-primary" id="paSave">${ic('check', 'i-sm')}Speichern</button></div>`;
    initSeg($('#paSeg', box), b => { st.scope = b.dataset.v; st.scope_values = []; render(); });
    if (q) { const i = $('#paQ', box); i.focus(); i.setSelectionRange(q.length, q.length); }
  };
  const sync = () => { st.name = $('#paName', box).value; st.from_date = $('#paFrom', box).value; st.to_date = $('#paTo', box).value; };
  box.addEventListener('input', e => { if (e.target.id === 'paQ') { sync(); q = e.target.value; render(); } });
  box.addEventListener('click', async e => {
    const pc = e.target.closest('[data-pct]'); if (pc) { sync(); st.pct = +pc.dataset.pct; return render(); }
    const sv = e.target.closest('[data-sv]'); if (sv) { sync(); const k = sv.dataset.sv, i = st.scope_values.indexOf(k); i >= 0 ? st.scope_values.splice(i, 1) : st.scope_values.push(k); return render(); }
    if (e.target.closest('#paAct')) { st.active = !st.active; e.target.closest('#paAct').setAttribute('aria-checked', st.active); return; }
    if (e.target.closest('#paDel')) { try { await stepUp({title: 'Aktion löschen', text: p.name}); const l = await invoke('promotion_delete', {id: p.id}); PROMOS.length = 0; PROMOS.push(...l); } catch (err) { if (!String(err).includes('abgebrochen')) toast('Nicht möglich', {t2: String(err), type: 'warn'}); return; } applyPromos(); closeLayer(el); renderAktionen(); return toast('Aktion gelöscht', {icon: 'trash'}); }

      Hooks.emit('pricing.promotion.saved', {name: st.name, prozent: st.pct});
    }
  });
  render();
}

function ivKpis() {
  const c = IV.cur, k = $('#ivKpis'); if (!k) return;
  const counted = c.lines.filter(l => l.counted != null), diff = counted.reduce((s, l) => s + (l.counted - l.expected), 0);
  const vk = counted.reduce((s, l) => s + (l.counted - l.expected) * l.price, 0), ek = counted.reduce((s, l) => s + (l.counted - l.expected) * (l.cost || 0), 0);
  k.innerHTML = `<div class="card"><b class="num">${counted.length} / ${c.lines.length}</b><span>Varianten gezählt</span></div><div class="card"><b class="num">${num(counted.reduce((s, l) => s + l.counted, 0))}</b><span>Stück gezählt</span></div><div class="card"><b class="num" style="color:${diff < 0 ? 'var(--neg)' : diff > 0 ? 'var(--pos)' : 'inherit'}">${diff > 0 ? '+' : ''}${num(diff)}</b><span>Differenz Stück (gezählt)</span></div><div class="card"><b>${eur(vk / 100)}</b><span>Differenz VK</span></div><div class="card"><b>${eur(ek / 100)}</b><span>Differenz EK</span></div>`;
}
function renderIvList() {

  const toks = norm(IV.q.trim()).split(/\s+/).filter(t => t && !/^\d{8,13}$/.test(t));
  const rows = c.lines.filter(l => (IV.f === 'alle' || (IV.f === 'offen' && l.counted == null) || (IV.f === 'gezaehlt' && l.counted != null) || (IV.f === 'diff' && l.counted != null && l.counted !== l.expected))
    && toks.every(t => norm(`${l.name} ${l.article_id} ${colorName(l.color)} ${l.size} ${l.ean}`).includes(t)));
  box.innerHTML = rows.length ? `<table class="tbl" style="margin:0"><thead><tr><th style="padding-left:16px">Artikel</th><th>EAN</th><th class="r">Soll</th><th class="r">Gezählt</th><th class="r" style="padding-right:16px">Differenz</th></tr></thead><tbody>${rows.slice(0, 400).map(l => { const d = l.counted == null ? null : l.counted - l.expected; return `<tr data-ivv="${l.variant_id}"><td style="padding-left:16px"><b>${esc(l.name)}</b><div class="muted" style="font-size:12px">${esc(colorName(l.color))} · ${esc(l.size)}</div></td><td class="mono" style="font-size:12px">${esc(l.ean)}</td><td class="r num">${l.expected}</td><td class="r"><input class="input num" data-ivc="${l.variant_id}" value="${l.counted ?? ''}" placeholder="–" inputmode="numeric" style="width:70px;height:30px;text-align:right"></td><td class="r num" style="padding-right:16px;font-weight:650;color:${d == null ? 'var(--text-3)' : d < 0 ? 'var(--neg)' : d > 0 ? 'var(--pos)' : 'inherit'}">${d == null ? '–' : (d > 0 ? '+' : '') + d}</td></tr>`; }).join('')}</tbody></table>${rows.length > 400 ? `<div class="muted" style="padding:10px 16px">… ${rows.length - 400} weitere – Suche verwenden</div>` : ''}`
    : '<div class="empty" style="padding:40px"><p>Keine Positionen in diesem Filter.</p></div>';
}
async function ivCount(args, quiet) {
  try {
    const r = await invoke('inventory_count', {id: IV.cur.id, ...args});
    const l = IV.cur.lines.find(x => x.variant_id === r.variant_id); if (l) l.counted = r.counted;
    if (!quiet) { renderIvList(); const tr = $(`[data-ivv="${r.variant_id}"]`); tr?.classList.add('flash'); tr?.scrollIntoView({block: 'nearest'}); }
    else ivKpis();
    return r;
  } catch (e) { toast('Nicht gezählt', {t2: String(e), type: 'warn', icon: 'barcode'}); return null; }
}

    }

      let zero = false;

        <div class="m-head"><div class="m-ic">${ic('check')}</div><div><h2>Inventur ${esc(c.no)} abschließen</h2><p>${c.lines.length - open} von ${c.lines.length} Varianten gezählt</p></div><button class="btn btn-ghost btn-icon x" data-close aria-label="Schließen">${ic('x')}</button></div>
        <div class="m-body" style="display:grid;gap:12px">${open ? `<div class="set-row" style="padding:10px 12px;border:1px solid var(--line);border-radius:12px"><div><div class="set-l">${open} ungezählte Varianten auf 0 setzen</div><div class="set-h">Aus: Bestand bleibt unverändert (Teilinventur)</div></div><div class="set-c" style="min-width:0"><button class="switch" role="switch" id="ivZero" aria-checked="false" aria-label="Ungezählte auf 0"></button></div></div>` : ''}
          <div class="rule-box">${ic('shield')}<div>Die Differenzen werden als Bestandsbuchung „Inventur“ festgeschrieben. Freigabe durch die Filialleitung nötig.</div></div></div>
        <div class="m-foot"><span class="sp"></span><button class="btn btn-secondary" data-close>Abbrechen</button><button class="btn btn-primary" id="ivGo">${ic('shield', 'i-sm')}Freigeben & buchen</button></div></div>`);
      el.addEventListener('click', async ev => {
        if (ev.target.closest('#ivZero')) { zero = !zero; ev.target.closest('#ivZero').setAttribute('aria-checked', zero); return; }
        if (!ev.target.closest('#ivGo')) return;

        let r; try { r = await invoke('inventory_finish', {id: c.id, zeroUncounted: zero, user: S.user.name, approvedBy: by}); } catch (err) { return toast('Abschluss fehlgeschlagen', {t2: String(err), type: 'warn'}); }
        closeLayer(el); await loadCatalog(); applyPromos();

  });

  iv.addEventListener('change', e => { const vid = e.target.dataset.ivc; if (vid == null) return; const n = parseInt(e.target.value, 10); if (!Number.isFinite(n) || n < 0) return; ivCount({variantId: +vid, qty: n, add: false}, true).then(r => { if (r) { const tr = e.target.closest('tr'), d = r.counted - r.expected, td = tr.lastElementChild; td.textContent = (d > 0 ? '+' : '') + d; td.style.color = d < 0 ? 'var(--neg)' : d > 0 ? 'var(--pos)' : 'inherit'; } }); });
}

function hexToHS(hex) {

  const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;

function toHex(c) {
  const m = c.match(/rgba?\(([^)]+)\)/); if (!m) return c;
  const [r, g, b, a] = m[1].split(/[\s,/]+/).filter(Boolean).map(Number);
  const hx = '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('').toUpperCase();
  return a != null && a < 1 ? `${hx} · ${Math.round(a * 100)} %` : hx;
}

function toggleFullscreen() {
  invoke('set_fullscreen', {on: !S.fullscreen}).then(on => { S.fullscreen = on; toast(on ? 'Vollbild aktiv' : 'Vollbild beendet', {t2: on ? 'Beenden mit F11' : '', icon: 'layout'}); }).catch(e => toast('Vollbild nicht verfügbar', {t2: String(e), type: 'warn'}));

if (DESKTOP) {
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
    if (mod && ['+', '=', '-', '0'].includes(k)) { e.preventDefault(); e.stopPropagation(); return stepZoom(k === '0' ? 0 : k === '-' ? -1 : 1); }
    if (k === 'f5' || (mod && ['r', 'p', 'f', 'g', 'j', 'u'].includes(k))) e.preventDefault();
    if (k === 'f11') { e.preventDefault(); toggleFullscreen(); }
  }, true);

  document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, {passive: false});
}
document.addEventListener('keydown', e => {
  const k = e.key, typing = isTyping(e.target);
  if ((e.metaKey || e.ctrlKey) && k.toLowerCase() === 'k' && !S.locked) { e.preventDefault(); if (S.paletteOpen) { const t = topLayer(); t && closeLayer(t.el); } else openPalette(); return; }
  if (S.locked) { S.lockKey && S.lockKey(e); return; }
  if (layers.length) {
    const t = topLayer();
    if (k === 'Escape') { e.preventDefault(); if (t.escClose) closeLayer(t.el); }
    else if (k === 'Tab') trapFocus(e);
    else if (!e.defaultPrevented && e.target.isConnected && !t.el.contains(e.target)) { const fwd = new KeyboardEvent('keydown', {key: k, bubbles: true, cancelable: true}); t.el.dispatchEvent(fwd); if (fwd.defaultPrevented) e.preventDefault(); }
    return;
  }
  if (k === 'Escape' && pop) { closePopover(); return; }
  if (k === 'Escape' && Dash.editing && S.view === 'dashboard') { setEditing(false); return; }
  if (S.view === 'kasse' && posKey(e, typing)) return;
  if (typing) { if (k === 'Escape') e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (k === '/') { e.preventDefault(); const f = S.view === 'kasse' ? $('#posSearch') : S.view === 'dashboard' ? $('#askInput') : null; f ? f.focus() : openPalette(); return; }
  if (k === '?') { openShortcuts(); return; }
  if (k === '[') { toggleSidebar(); return; }
  if (Date.now() - gChord < 900) { const v = {d: 'dashboard', k: 'kasse', a: 'artikel', b: 'bestand', s: 'designsystem'}[k.toLowerCase()]; gChord = 0; if (v) { go(v); return; } }
  if (k.toLowerCase() === 'g') gChord = Date.now();
});
