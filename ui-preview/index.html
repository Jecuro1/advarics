.radio{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:1px solid var(--line-2);font-size:13px;cursor:pointer;transition:border-color var(--d-1),background var(--d-1)}
.radio:hover{border-color:var(--line-3)}
.radio input{accent-color:hsl(var(--ah) var(--as) var(--al))}
.radio:has(input:checked){border-color:var(--accent-line);background:var(--accent-soft)}
.radio small{margin-left:auto;color:var(--text-3);font-size:12px}
.check{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--text-2);line-height:1.45;cursor:pointer}
.check input{margin-top:3px;accent-color:hsl(var(--ah) var(--as) var(--al))}

/* Designsystem-Seite */
.ds{padding:30px 32px 60px;max-width:1240px;margin:0 auto}
.ds-sec{margin-top:40px}
.ds-sec>h2{font-size:17px;font-weight:620;letter-spacing:-.015em;display:flex;align-items:center;gap:10px}
.ds-sec>p{font-size:13.5px;color:var(--text-3);margin-top:4px;max-width:72ch;line-height:1.55}
.ds-grid{display:grid;gap:12px;margin-top:16px}
.ds-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ds-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.ds-cols-6{grid-template-columns:repeat(6,minmax(0,1fr))}
.princ{padding:18px}
.princ .reg-ic{margin-bottom:12px;color:var(--accent)}
.princ h3{font-size:14px;font-weight:600}
.princ p{font-size:12.5px;color:var(--text-3);line-height:1.55;margin-top:4px}
.sw-card{overflow:hidden}
.sw-card .sw{height:64px;background:var(--v);border-bottom:1px solid var(--line)}
.sw-card .meta{padding:10px 12px}
.sw-card .t1{font-size:12.5px;font-weight:600}
.sw-card .t2{font:11px/1.4 var(--font-mono);color:var(--text-3)}
.type-row{display:grid;grid-template-columns:150px 1fr;align-items:baseline;gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}
.type-row .k{font:11.5px/1.4 var(--font-mono);color:var(--text-3)}
.comp-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:18px;border-bottom:1px solid var(--line)}
.comp-row:last-child{border-bottom:0}
.comp-row .lbl{width:120px;font-size:12px;color:var(--text-3);flex:none}
.space-viz{display:flex;align-items:flex-end;gap:14px;padding:18px;flex-wrap:wrap}
.space-viz div{display:flex;flex-direction:column;align-items:center;gap:6px;font:11px var(--font-mono);color:var(--text-3)}
.space-viz i{display:block;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:3px}
.layers{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.layers span{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:550}
.layers .i{color:var(--text-4);width:14px;height:14px}
.preset{padding:0;overflow:hidden;text-align:left;transition:border-color var(--d-1),transform var(--d-2) var(--ease-out)}
.preset:hover{border-color:var(--line-3);transform:translateY(-2px)}
.preset[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.preset .pv{height:86px;display:grid;grid-template-columns:28px 1fr;gap:6px;padding:10px}
.preset .pv i{border-radius:5px;display:block}
.preset .meta{padding:10px 12px;border-top:1px solid var(--line)}
.preset .t1{font-size:13px;font-weight:600}
.preset .t2{font-size:11.5px;color:var(--text-3)}
.motion-demo{display:flex;gap:16px;flex-wrap:wrap;padding:18px}
.motion-demo .md{flex:1;min-width:150px}
.motion-demo .trk{height:40px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);position:relative;margin-top:8px}
.motion-demo .ball{position:absolute;top:7px;left:7px;width:24px;height:24px;border-radius:7px;background:var(--accent)}
.motion-demo .k{font:11.5px var(--font-mono);color:var(--text-3)}

/* Platzhalter-Ansichten */
.ph{height:100%;display:grid;place-items:center;padding:40px}
.ph .empty{max-width:520px}
.ph .empty-icon{width:64px;height:64px;border-radius:20px;color:var(--accent)}
.ph .empty h3{font-size:19px;letter-spacing:-.015em}
.ph .empty p{max-width:46ch;font-size:14px}
.ph ul{list-style:none;padding:0;margin:10px 0 6px;display:grid;gap:8px;text-align:left}
.ph li{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--text-2)}
.ph li .i{color:var(--accent);width:16px;height:16px;margin-top:1px}

/* ════════════════════════════════════════════════════════════════════
   9 · RESPONSIV
   ════════════════════════════════════════════════════════════════════ */
@media (max-width:1360px){ .hide-md{display:none!important} }
@media (max-width:1280px){
  :root{--cart-w:372px}
  .tb-search{width:clamp(180px,22vw,300px)}
}
@media (max-width:1200px){
  .w.s{grid-column:span 6}.w.m{grid-column:span 12}.w.tall{grid-column:span 6}.w.wide{grid-column:span 6}.w.l{grid-column:span 12}
  .add-tile{grid-column:span 6}
}
@media (max-width:1100px){
  .pay,.pay-done{grid-template-columns:1fr;height:auto;max-height:calc(100dvh - 48px);overflow:auto}
  .pay-l,.done-r{border:0}
  .ds-cols-6{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ds-cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .app,.app.sb-collapsed{grid-template-columns:0 minmax(0,1fr)}
  .sidebar{position:fixed;z-index:150;left:0;top:0;bottom:0;width:260px;background:var(--frame);transform:translateX(-100%);transition:transform var(--d-3) var(--ease-out);box-shadow:var(--shadow-3)}
  .app.sb-open .sidebar{transform:none}
  .app.sb-collapsed .sidebar .fade-label{opacity:1;transform:none}
  .main{margin:0;border-radius:0;border:0}
  .tb-menu{display:inline-flex}
  .tb-search .lbl,.tb-search .kbds{display:none}
  .tb-search{width:34px;padding:0;justify-content:center}
  .tb-sub{display:none}
  .pos-root{grid-template-columns:1fr}
  .cart{position:fixed;z-index:80;left:0;right:0;bottom:30px;height:min(78dvh,640px);border-left:0;border-top:1px solid var(--line-2);border-radius:20px 20px 0 0;box-shadow:var(--shadow-3);transform:translateY(calc(100% + 40px));transition:transform var(--d-3) var(--ease-out)}
  .cart.open{transform:none}
  .cart-toggle{display:flex;position:fixed;z-index:79;left:12px;right:12px;bottom:40px;height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);align-items:center;gap:10px;padding:0 18px;font-weight:650;box-shadow:var(--shadow-3)}
  .cart-toggle .amt{margin-left:auto}
  .grid-wrap{padding:10px 14px 90px}
  .agrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .pos-head{padding:12px 14px 0}
  .grid-meta{padding:12px 14px 0}
  .fbar{display:none}
  .cart.open + .cart-toggle{opacity:0;pointer-events:none}
  .dgrid{grid-template-columns:1fr}
  .w.s,.w.m,.w.tall,.w.wide,.w.l,.w.xl,.add-tile{grid-column:span 1}
  .dash{padding:18px 16px 40px}
  .hide-sm{display:none!important}
  .vp{grid-template-columns:1fr}
  .vp-media{min-height:220px;border-radius:20px 20px 0 0}
  .ds-cols-3,.ds-cols-4,.ds-cols-6{grid-template-columns:1fr 1fr}
  .methods{grid-template-columns:repeat(2,1fr)}
  .pay-cols{grid-template-columns:1fr}
  .done-r{display:none}
  .inspector{left:12px}
}

/* ════════════════════════════════════════════════════════════════════
   10 · BEWEGUNG — reduziert
   ════════════════════════════════════════════════════════════════════ */
[data-motion="reduced"] *,[data-motion="reduced"] *::before,[data-motion="reduced"] *::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}
@media (forced-colors:active){
  .w,.tile,.card,.modal,.palette{border:1px solid CanvasText}
}

    const r = svg.getBoundingClientRect(), xv = d.xMin + (e.clientX - r.left - m.l) / iw * (d.xMax - d.xMin);
    let best = 0, bd = Infinity; xs.forEach((x, i) => { const dd = Math.abs(x - xv); if (dd < bd) { bd = dd; best = i; } });
    if (best !== idx || !tip.classList.contains('on')) show(best);
  });
  hit.addEventListener('pointerleave', hide); hit.addEventListener('blur', hide);
  hit.addEventListener('focus', () => show(xs.findIndex(x => x >= aN.x - 1e-6)));
  hit.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { show(idx + 1); e.preventDefault(); } else if (e.key === 'ArrowLeft') { show(idx - 1); e.preventDefault(); } });
}

function flip(container, mutate) {
  const items = $$('.w', container), first = new Map(items.map(el => [el, el.getBoundingClientRect()]));

}
function commitOrder() {

function startDrag(w, ev) {

}
function moveDrag(d, ev) {

}

    const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); if (drag) endDrag(drag); };

function totals() {
  let sub = 0, ldisc = 0; const byRate = {};
  POS.cart.forEach(l => { const g = r2(l.unit * l.qty), d = l.disc ? r2(g * l.disc.pct / 100) : 0; sub += g; ldisc += d; byRate[l.vat] = (byRate[l.vat] || 0) + g - d; });

}

        ${rule ? `<div class="prompt-hint" style="margin-top:14px">${ic('flow', 'i-xs')}${esc(rule)}</div>` : ''}
      </div></div>`, {onClose: () => { if (!done) reject(new Error('abgebrochen')); }});
    const body = $('#suBody', el);
    const dots = () => $$('#suDots i', el).forEach((d, i) => d.classList.toggle('on', i < pin.length));
    const ok = async method => {

function hexToHS(hex) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  let h = 0; if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
  return {h: Math.round((h * 60 + 360) % 360), s: Math.round(clamp(s, .05, .8) * 100), name: 'Eigene'};
}

function toHex(c) {

document.addEventListener('keydown', e => {
  const k = e.key, typing = isTyping(e.target);
  if ((e.metaKey || e.ctrlKey) && k.toLowerCase() === 'k' && !S.locked) { e.preventDefault(); if (S.paletteOpen) { const t = topLayer(); t && closeLayer(t.el); } else openPalette(); return; }
  if (S.locked) { S.lockKey && S.lockKey(e); return; }
  if (layers.length) {
    const t = topLayer();
    if (k === 'Escape') { e.preventDefault(); if (t.escClose) closeLayer(t.el); }
    else if (k === 'Tab') trapFocus(e);
    else if (!e.defaultPrevented && e.target.isConnected && !t.el.contains(e.target)) { const fwd = new KeyboardEvent('keydown', {key: k, bubbles: true, cancelable: true}); t.el.dispatchEvent(fwd); if (fwd.defaultPrevented) e.preventDefault(); }
    return;
  }
  if (k === 'Escape' && pop) { closePopover(); return; }
  if (k === 'Escape' && Dash.editing && S.view === 'dashboard') { setEditing(false); return; }
  if (S.view === 'kasse' && posKey(e, typing)) return;
  if (typing) { if (k === 'Escape') e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (k === '/') { e.preventDefault(); const f = S.view === 'kasse' ? $('#posSearch') : S.view === 'dashboard' ? $('#askInput') : null; f ? f.focus() : openPalette(); return; }
  if (k === '?') { openShortcuts(); return; }
  if (k === '[') { toggleSidebar(); return; }
  if (Date.now() - gChord < 900) { const v = {d: 'dashboard', k: 'kasse', a: 'artikel', b: 'bestand', s: 'designsystem'}[k.toLowerCase()]; gChord = 0; if (v) { go(v); return; } }
  if (k.toLowerCase() === 'g') gChord = Date.now();
});
